  guideBack() { Sheet.open(addExSheet); },
  startWith(d) {
    const menu = d.menu ? Menus.get(d.menu) : null, from = d.from ? Model.get(d.from) : null;
    Actions.start();
    const s = Q.active(); if (!s || (!menu && !from)) return;
    Menus.addTo(s, menu ? menu.items : from.exercises.map(e => e.name));
    Toast.show(`<span>${U.hm(s.start)} 入館 · ${U.esc(menu ? Menus.label(menu) : Q.title(from))}のメニューを用意しました</span>`);
  },
  useMenu(d) {
    const m = Menus.get(d.id), s = Model.get(d.sid) || Q.active(); if (!m || !s) return;
    if (Sheet.fn) Sheet.close();
    const n = Menus.addTo(s, m.items);
    Toast.show(n ? `<span>「${U.esc(Menus.label(m))}」の${n}種目を追加しました</span>` : '<span>このメニューの種目はすべて追加済みです</span>');
  },
  menus() { Sheet.open(menusSheet); },
  menuNew(d) {
    UI.mEdit = { id: null, name: '', items: [], q: '', part: 'chest', from: d.from || 'list', confirm: false };
    Sheet.open(menuEditSheet);
  },
  menuFromSession(d) {
    const s = Model.get(d.sid); if (!s) return;
    const items = s.exercises.map(e => e.name), title = Q.title(s);
    UI.mEdit = { id: null, name: title === 'トレーニング' ? '' : title, items, q: '', part: Lib.part(items[0]), from: 'live', confirm: false };
    Sheet.open(menuEditSheet);
  },
  menuEdit(d) {
    const m = Menus.get(d.id); if (!m) return;
    UI.mEdit = { id: m.id, name: m.name, items: [...m.items], q: '', part: Lib.part(m.items[0]), from: 'list', confirm: false };
    Sheet.open(menuEditSheet);
  },
  menuToggle(d) { const it = UI.mEdit.items, i = it.indexOf(d.name); if (i >= 0) it.splice(i, 1); else it.push(d.name); Sheet.refresh(); },
  menuDrop(d) { UI.mEdit.items.splice(Number(d.i), 1); Sheet.refresh(); },
  menuMove(d) { const i = Number(d.i), it = UI.mEdit.items; if (i > 0) [it[i - 1], it[i]] = [it[i], it[i - 1]]; Sheet.refresh(); },
  menuPart(d) { UI.mEdit.part = d.p; const l = $('#mnlist'); if (l) l.innerHTML = menuPickHTML(); },
  menuNewEx(d) {
    const name = (d.name || '').trim().slice(0, 40); if (!name) return;
    if (!LIBMAP.has(name) && !Store.meta.custom[name]) { Store.meta.custom[name] = PARTS[d.part] ? d.part : 'other'; Store.commit({ meta: true, silent: true }); }
    if (!UI.mEdit.items.includes(name)) UI.mEdit.items.push(name);
    UI.mEdit.q = ''; UI.mEdit.part = Lib.part(name);
    Sheet.refresh();
  },
  menuSave() {
    const m = UI.mEdit; if (!m || !m.items.length) return;
    const name = m.name.trim().slice(0, 20);
    const t = m.id && Menus.get(m.id);
    if (t) { t.name = name; t.items = [...m.items]; }
    else Store.meta.menus.push({ id: U.id(), name, items: [...m.items] });
    const label = Menus.label({ name, items: m.items });
    Store.commit({ meta: true });
    if (m.from === 'live') Sheet.close(); else Sheet.open(menusSheet);
    Toast.show(`<span>「${U.esc(label)}」を保存しました</span>`);
  },
  menuDelAsk() { UI.mEdit.confirm = true; Sheet.refresh(); },
  menuDelCancel() { UI.mEdit.confirm = false; Sheet.refresh(); },
  menuDel() {
    Store.meta.menus = Store.meta.menus.filter(x => x.id !== UI.mEdit.id);
    Store.commit({ meta: true });
    Sheet.open(menusSheet);
    Toast.show('<span>メニューを削除しました</span>');
  },
  skipToday() { Suggest.skip(); App.render(); Toast.show('<span>今日はゆっくり休みましょう</span>'); },
  unskip() { Suggest.unskip(); App.render(); },
  partAsk(d) { UI.partFor = { name: d.name, from: d.from || 'card' }; Sheet.open(partSheet); },
  setPart(d) {
    const { name, from } = UI.partFor || {}; if (!name || !PARTS[d.p]) return;
    Store.meta.custom[name] = d.p;
    Store.commit({ meta: true });
    if (from === 'pick') { UI.exPart = d.p; UI.exQuery = ''; Sheet.open(addExSheet); }
    else Sheet.close();
    Toast.show(`<span>「${U.esc(name)}」を${PARTS[d.p]}に移しました</span>`);
  },
  syncOpen() { UI.sync = { email: FB.email(), pass: '', err: '', busy: false }; Sheet.open(syncSheet); },
  async syncIn(d) {
    const u = UI.sync; if (!u || u.busy) return;
    const email = (u.email || '').trim(), pass = u.pass || '';
    if (!email) { u.err = 'メールアドレスを入力してください'; Sheet.refresh(); return; }
    if (pass.length < 6) { u.err = 'パスワードは6文字以上で入力してください'; Sheet.refresh(); return; }
    u.busy = d.mode; u.err = ''; Sheet.refresh();
    try {
      await FB.signIn(email, pass, d.mode === 'signup');
      UI.sync = null; Sheet.close();
      Toast.show(`<span>${d.mode === 'signup' ? '登録しました' : 'ログインしました'}。記録を同期しています</span>`, 3200);
    } catch (e) {
      if (!UI.sync) return;
      UI.sync.busy = false; UI.sync.err = FB.errText(e); Sheet.refresh();
    }
  },
  async syncReset() {
    const u = UI.sync; if (!u) return;
    const email = (u.email || '').trim();
    if (!email) { u.err = 'メールアドレスを入力してから押してください'; Sheet.refresh(); return; }
    try { await FB.reset(email); u.err = ''; Sheet.refresh(); Toast.show('<span>パスワード再設定のメールを送りました</span>', 3600); }
    catch (e) { u.err = FB.errText(e); Sheet.refresh(); }
  },
  async syncOut() { await FB.signOut(); Sheet.refresh(); Toast.show('<span>ログアウトしました。この端末の記録はそのまま残ります</span>', 3200); },
  syncNow() { if (Cloud.col) Cloud.sync(); else FB.start(); },
  appCheck() { Updater.check(true); },
  appUpdate() { Updater.apply(); },
  testSound() { Sound.prime().then(() => { Sound.beep(); if (!Sound.ready()) Toast.show('<span>この環境では音を鳴らせませんでした</span>'); }); },
  pickEx(d) {
    const name = (d.name || '').trim().slice(0, 40);
    const s = Model.get(UI.addSid); if (!name || !s) return;
    Sheet.close();
    let isNew = false;
    if (!LIBMAP.has(name) && !Store.meta.custom[name] && !Q.stats().ex.has(name)) {
      Store.meta.custom[name] = PARTS[d.part] ? d.part : 'other'; isNew = true;
      Store.commit({ meta: true, silent: true });
    }
    const e = Model.addExercise(s.id, name);
    if (isNew) Toast.show(`<span>「${U.esc(name)}」を${PARTS[Lib.part(name)]}に追加しました</span>`);
    UI.exQuery = '';
    requestAnimationFrame(() => {
      const card = document.getElementById('ex-' + e.id);
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  },
  copyMenu(d) {
    const s = Model.get(d.sid), from = Model.get(d.from); if (!s || !from) return;
    const have = new Set(s.exercises.map(e => e.name));
    const add = from.exercises.filter(e => !have.has(e.name)).map(e => ({ id: U.id(), name: e.name, sets: [], memo: '' }));
    s.exercises.push(...add);
    Store.commit({ sessions: [s.id] });
    Toast.show(`<span>${add.length}種目をコピーしました</span>`);
  },
  step(d) {
    const input = document.getElementById(`${d.k}-${d.ex}`); if (!input) return;
    const step = d.k === 'w' ? Store.settings.step : 1;
    let v = parseFloat(String(input.value).replace(',', '.')) || 0;
    v = Math.max(0, Math.round((v + step * Number(d.d)) * 100) / 100);
    if (d.k === 'r') v = Math.round(v);
    input.value = d.k === 'w' ? U.w(v) : String(v);
    input.dispatchEvent(new Event('input', { bubbles: true }));
    Haptic.tap();
  },
  logSet(d) {
    const f = findEx(d); if (!f) return;
    const { s, e } = f;
    const wEl = document.getElementById('w-' + e.id), rEl = document.getElementById('r-' + e.id);
    const w = parseFloat(String(wEl.value).replace(',', '.') || '0'), r = parseInt(rEl.value, 10);
    if (!Number.isFinite(w) || w < 0 || w > 1000) { shake(wEl); return; }
    if (!Number.isFinite(r) || r < 1 || r > 999) { shake(rEl); rEl.focus(); return; }
    const best = Q.best(e.name, s);
    const sessMax = e.sets.length ? Math.max(...e.sets.map(x => x.w)) : -Infinity;
    const isPR = best !== null && w > Math.max(best, sessMax);
    const live = !s.end;
    e.sets.push({ w: Math.round(w * 100) / 100, r, at: live ? Date.now() : (s.end || s.start) });
    Drafts.m.set(e.id, { w: U.w(w), r: String(r) });
    Sound.prime();
    if (isTyping()) document.activeElement.blur();
    UI.flash = `${e.id}:${e.sets.length - 1}`;
    Store.commit({ sessions: [s.id] });
    UI.flash = null;
    if (isPR) Toast.pr(e.name, best, w);
    if (live && UI.tab === 'today' && Store.settings.restAuto) Rest.start(Store.settings.restSec);
    Haptic.tap();
  },
  delSet(d) {
    const f = findEx(d); if (!f) return;
    const i = Number(d.i);
    UI.undo = { sid: f.s.id, exercises: U.clone(f.s.exercises) };
    f.e.sets.splice(i, 1);
    Store.commit({ sessions: [f.s.id] });
    Toast.show(`<span>${i + 1}セット目を削除しました</span><button class="t-act" data-act="undo">元に戻す</button>`, 4500);
  },
  delEx(d) {
    const f = findEx(d); if (!f) return;
    UI.undo = { sid: f.s.id, exercises: U.clone(f.s.exercises) };
    f.s.exercises = f.s.exercises.filter(x => x.id !== f.e.id);
    Store.commit({ sessions: [f.s.id] });
    Toast.show(`<span>「${U.esc(f.e.name)}」を削除しました</span><button class="t-act" data-act="undo">元に戻す</button>`, 4500);
  },
  undo() {
    const u = UI.undo; if (!u) return;
    const s = Model.get(u.sid); if (!s || s.deleted) return;
    s.exercises = u.exercises; UI.undo = null;
    Store.commit({ sessions: [s.id] });
    Toast.hide();
  },
  memo(d) {
    UI.memoOpen.add(d.ex); App.render();
    const t = document.getElementById('memo-' + d.ex); if (t) t.focus();
  },

  restPick(d) { const v = Number(d.v); Store.settings.restSec = v; Store.commit({ meta: true }); Sound.prime(); Rest.start(v); },
  restAdd(d) { Rest.add(Number(d.d)); },
  restStop() { Rest.stop(); },

  calMove(d) { const m = UI.calMonth; UI.calMonth = new Date(m.getFullYear(), m.getMonth() + Number(d.d), 1); App.render(); },
  calToday() { const n = new Date(); UI.calMonth = new Date(n.getFullYear(), n.getMonth(), 1); App.render(); },
  day(d) { UI.calSel = d.k; App.render(); Sheet.open(() => detailSheet(d.k)); },
  openDay(d) { Sheet.open(() => detailSheet(d.k)); },
  goToday() { Sheet.close(); App.go('today'); },
  editSession(d) {
    Sheet.close();
    if (UI.tab !== 'edit') UI.back = UI.tab;
    UI.editId = d.sid;
    App.go('edit');
  },
  editDone() { App.go(UI.back || 'calendar'); },
  editTime() {
    const s = Model.get(UI.editId); if (!s) return;
    const base = U.fromKey(s.date);
    const at = v => { const [h, m] = v.split(':').map(Number); const x = new Date(base); x.setHours(h, m, 0, 0); return x.getTime(); };
    const sv = $('#edStart')?.value, ev = $('#edEnd')?.value;
    if (!sv) return;
    s.start = at(sv);
    if (s.end && ev) { let e = at(ev); if (e <= s.start) e += 864e5; s.end = e; }
    Store.commit({ sessions: [s.id] });
  },
  askDel(d) { UI.confirmDel = d.sid; Sheet.refresh(); },
  cancelDel() { UI.confirmDel = null; Sheet.refresh(); },
  doDel(d) { UI.confirmDel = null; Model.remove([d.sid]); Toast.show('<span>記録を削除しました</span>'); },
  addOnDate(d) {
    const base = U.fromKey(d.k).getTime();
    const avgMin = Q.avgStartMin() ?? 19 * 60, dur = Q.stats().avg || 90 * 60000;
    let start = base + avgMin * 60000, end = start + dur;
    if (end > Date.now()) { end = Date.now(); start = Math.max(base, end - dur); }
    const s = Model.createPast(start, end);
    Sheet.close();
    UI.back = UI.tab === 'edit' ? UI.back : UI.tab;
    UI.editId = s.id;
    App.go('edit');
  },
  statEx(d) { UI.statEx = d.name; App.render(); },

  toggle(d) {
    Store.settings[d.k] = !Store.settings[d.k]; Store.commit({ meta: true }); Wake.sync();
    if (d.k === 'restSound') { Rest.disarm(); Rest.rearm(); }
  },
  setRest(d) { Store.settings.restSec = Number(d.v); Store.commit({ meta: true }); },
  setStep(d) { Store.settings.step = Number(d.v); Store.commit({ meta: true }); },

  sampleAdd() {
    const list = makeSamples();
    for (const s of list) Store.state.sessions[s.id] = s;
    Store.commit({ sessions: list.map(s => s.id) });
    Sheet.close();
    Toast.show('<span>サンプルを追加しました。設定からいつでも削除できます</span>', 3200);
  },
  sampleRemove() {
    const ids = Object.values(Store.state.sessions).filter(s => s.sample && !s.deleted).map(s => s.id);
    Model.remove(ids);
    Toast.show('<span>サンプルデータを削除しました</span>');
  },
  async exportData() {
    const json = JSON.stringify({ app: 'kintore-diary', exportedAt: new Date().toISOString(), v: 1, sessions: Store.state.sessions, meta: Store.state.meta }, null, 2);
    const name = `kintore-diary-${U.key(Date.now())}.json`;
    if (Caps.downloads) {
      try { await Caps.downloads.save({ filename: name, data: json }); Toast.show('<span>バックアップを保存しました</span>'); }
      catch (e) { if (e?.code !== 'declined') Toast.show('<span>保存できませんでした</span>'); }
      return;
    }
    if (!window.claude) {
      try {
        const file = new File([json], name, { type: 'application/json' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: '筋トレ日記のバックアップ' }); return; }
      } catch (e) { if (e && e.name === 'AbortError') return; }
      try {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
        a.download = name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        return;
      } catch {}
    }
    try { await navigator.clipboard.writeText(json); Toast.show('<span>バックアップをクリップボードにコピーしました</span>'); }
    catch { Toast.show('<span>この環境ではバックアップを保存できません</span>'); }
  },
  importFile(input) {
    const file = input.files && input.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const data = JSON.parse(rd.result), ids = [];
        for (const [id, s] of Object.entries(data.sessions || {})) {
          if (!s || typeof s.start !== 'number' || !s.date) continue;
          const cur = Store.state.sessions[id];
          if (!cur || (s.updatedAt || 0) > (cur.updatedAt || 0)) { Store.state.sessions[id] = { exercises: [], memo: '', ...s }; ids.push(id); }
        }
        if (data.meta && data.meta.custom) Object.assign(Store.meta.custom, data.meta.custom);
        if (data.meta && Array.isArray(data.meta.menus)) for (const m of normMeta(data.meta).menus) if (!Store.meta.menus.some(x => x.id === m.id)) Store.meta.menus.push(m);
        Store.commit({ sessions: ids, meta: true });
        Toast.show(`<span>${ids.length}件の記録を読み込みました</span>`);
      } catch { Toast.show('<span>このファイルは読み込めませんでした</span>'); }
      input.value = '';
    };
    rd.readAsText(file);
  },
  wipeAsk() { UI.confirmWipe = true; Sheet.refresh(); },
  wipeCancel() { UI.confirmWipe = false; Sheet.refresh(); },
  wipeDo() {
    UI.confirmWipe = false;
    Model.remove(Object.values(Store.state.sessions).filter(s => !s.deleted).map(s => s.id));
    Rest.stop(); Drafts.m.clear();
    Sheet.close();
    Toast.show('<span>すべての記録を削除しました</span>');
  },
};

/* ============================================================
   11. Event wiring & boot
   ============================================================ */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const fn = Actions[t.dataset.act];
  if (fn) { e.preventDefault(); fn(t.dataset, t, e); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.draft) {
    const d = Drafts.m.get(t.dataset.ex) || { w: '', r: '' };
    d[t.dataset.draft] = t.value; Drafts.m.set(t.dataset.ex, d);
  } else if (t.dataset.memo) {
    const f = findEx(t.dataset); if (!f) return;
    f.e.memo = t.value;
    clearTimeout(memoTimer);
    memoTimer = setTimeout(() => Store.commit({ sessions: [f.s.id], silent: true }), 600);
  } else if (t.id === 'exq') {
    UI.exQuery = t.value;
    const l = $('#exlist'); if (l) { l.innerHTML = exListHTML(); }
  } else if (t.id === 'endMemo') UI.endMemo = t.value;
  else if (t.id === 'mnName' && UI.mEdit) UI.mEdit.name = t.value;
  else if ((t.id === 'sgEmail' || t.id === 'sgPass') && UI.sync) UI.sync[t.id === 'sgEmail' ? 'email' : 'pass'] = t.value;
  else if (t.id === 'mnq' && UI.mEdit) { UI.mEdit.q = t.value; const l = $('#mnlist'); if (l) l.innerHTML = menuPickHTML(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'edStart' || t.id === 'edEnd') Actions.editTime();
  else if (t.id === 'importFile') Actions.importFile(t);
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Escape' && Sheet.fn) { Sheet.close(); return; }
  if (e.key !== 'Enter') return;
  if (t.dataset && t.dataset.draft) {
    e.preventDefault();
    if (t.dataset.draft === 'w') { const r = document.getElementById('r-' + t.dataset.ex); if (r) r.focus(); }
    else Actions.logSet(t.dataset);
  } else if (t.id === 'sgEmail') {
    e.preventDefault(); const pw = $('#sgPass'); if (pw) pw.focus();
  } else if (t.id === 'sgPass') {
    e.preventDefault(); t.blur(); Actions.syncIn({ mode: 'login' });
  } else if (t.id === 'mnName') {
    e.preventDefault(); t.blur();
  } else if (t.id === 'mnq') {
    e.preventDefault();
    const q = (UI.mEdit?.q || '').trim(); if (!q) return;
    const ql = q.toLowerCase(), names = allExerciseNames();
    const hit = names.includes(q) ? q : names.find(n => n.toLowerCase().includes(ql) || Lib.en(n).toLowerCase().includes(ql));
    if (hit) { if (!UI.mEdit.items.includes(hit)) UI.mEdit.items.push(hit); UI.mEdit.q = ''; Sheet.refresh(); }
    else { t.blur(); const pp = $('#mnlist .part-pick'); if (pp) { pp.classList.remove('shake'); void pp.offsetWidth; pp.classList.add('shake'); } }
  } else if (t.id === 'exq') {
    e.preventDefault();
    const q = UI.exQuery.trim(); if (!q) return;
    const ql = q.toLowerCase();
    const names = allExerciseNames();
    const hit = names.includes(q) ? q : names.find(n => n.toLowerCase().includes(ql) || Lib.en(n).toLowerCase().includes(ql));
    if (hit) Actions.pickEx({ name: hit });
    else { t.blur(); const pp = $('.part-pick'); if (pp) { pp.classList.remove('shake'); void pp.offsetWidth; pp.classList.add('shake'); } }
  }
});
document.addEventListener('focusin', e => { if (e.target.dataset && e.target.dataset.draft) setTimeout(() => { try { e.target.select(); } catch {} }, 0); });
document.addEventListener('focusout', () => {
  if (App.pendingRemote) setTimeout(() => { if (!isTyping() && App.pendingRemote) { App.pendingRemote = false; App.render(); } }, 50);
});
document.addEventListener('pointerover', e => { const h = e.target.closest && e.target.closest('.hit'); if (h) Charts.tip(h); });
document.addEventListener('pointerdown', e => { const h = e.target.closest && e.target.closest('.hit'); if (h) Charts.tip(h); else Charts.hideAll(); });
document.addEventListener('pointerout', e => {
  if (e.pointerType !== 'mouse') return;
  const from = e.target.closest && e.target.closest('.hit'), to = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.hit');
  if (from && !to) Charts.hideAll();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { App.render(); Wake.sync(); Rest.rearm(); Updater.check(false); }
  else Rest.disarm();
});
const primeSound = () => Sound.prime();
document.addEventListener('click', primeSound, true);
document.addEventListener('touchend', primeSound, { capture: true, passive: true });
Sound.onReady = () => Rest.rearm();
let rsz = 0;
window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(() => Charts.mount(App.view), 150); });
window.addEventListener('storage', e => { if (e.key === LS.data && !isTyping()) { Store.load(); App.render(); } });

function boot() {
  App.view = $('#view');
  Sheet.root = $('#sheet'); Sheet.panel = $('#sheetPanel');
  Toast.el = $('#toast'); Rest.el = $('#rest');
  Store.load(); Rest.load();
  App.render(); Rest.paint();
  setInterval(tick, 500);
  Wake.sync();
  Cloud.init();
  FB.start();
  try { if (sessionStorage.getItem('kintore-diary.updated')) { sessionStorage.removeItem('kintore-diary.updated'); setTimeout(() => Toast.show('<span>最新のバージョンに更新しました</span>'), 400); } } catch {}
  setTimeout(() => Updater.check(false), 2500);
  if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(d => { Caps.downloads = d; }).catch(() => {});
  if (location.hash === '#calendar' || location.hash === '#stats') App.go(location.hash.slice(1));
}
boot();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(() => {}); });
}
</script>
