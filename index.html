<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>筋トレ日記</title>
<meta name="description" content="開始と終了を押すだけで、日付・入館/退館・滞在時間・種目とセットが残る筋トレ日記。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#F2F3F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#060708" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="筋トレ日記">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column (max 560px) centered at every size; glass tab bar fixed to the bottom; sheets rise from the bottom edge */
:root{
  --bg:#F2F3F5;
  --card:#FFFFFF;
  --fill:#E8EAED;
  --fill-2:#F5F6F7;
  --fg:#0E0F11;
  --fg-2:#3B3E44;
  --muted:#767A82;
  --line:rgba(14,15,17,.09);
  --inv-bg:#0E0F11;
  --inv-fg:#FFFFFF;
  --rec:#E5484D;
  --on-rec:#FFFFFF;
  --pr:#946A1C;
  --pr-wash:rgba(148,106,28,.12);
  --bar:#BCC0C7;
  --thumb-off:#FFFFFF;
  --glass:rgba(242,243,245,.84);
  --scrim:rgba(14,15,17,.30);
  --shadow:0 1px 1px rgba(14,15,17,.03),0 6px 22px rgba(14,15,17,.06);
  --pop-shadow:0 12px 32px rgba(14,15,17,.18);
  --sans:"Geist","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-card:20px;
  --r-ctl:14px;
  --ease:cubic-bezier(.22,.8,.24,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#060708;--card:#141518;--fill:#222428;--fill-2:#1A1C1F;--fg:#F2F3F5;--fg-2:#C7CAD0;--muted:#8C9199;
    --line:rgba(255,255,255,.08);--inv-bg:#F2F3F5;--inv-fg:#0E0F11;--rec:#FF5C61;--on-rec:#FFFFFF;--pr:#DDB466;
    --pr-wash:rgba(221,180,102,.14);--bar:#43474E;--thumb-off:#5B6068;--glass:rgba(6,7,8,.8);--scrim:rgba(0,0,0,.58);
    --shadow:0 0 0 1px rgba(255,255,255,.045);--pop-shadow:0 12px 32px rgba(0,0,0,.5);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#060708;--card:#141518;--fill:#222428;--fill-2:#1A1C1F;--fg:#F2F3F5;--fg-2:#C7CAD0;--muted:#8C9199;
  --line:rgba(255,255,255,.08);--inv-bg:#F2F3F5;--inv-fg:#0E0F11;--rec:#FF5C61;--on-rec:#FFFFFF;--pr:#DDB466;
  --pr-wash:rgba(221,180,102,.14);--bar:#43474E;--thumb-off:#5B6068;--glass:rgba(6,7,8,.8);--scrim:rgba(0,0,0,.58);
  --shadow:0 0 0 1px rgba(255,255,255,.045);--pop-shadow:0 12px 32px rgba(0,0,0,.5);color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.no-scroll{overflow:hidden}
h1,h2,h3,p,ol,ul{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
button:disabled{cursor:default}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:10px}
small{font-size:inherit}

.app{max-width:560px;margin:0 auto;padding-inline:20px;padding-block:6px calc(156px + env(safe-area-inset-bottom,0px))}
.view.enter{animation:enter .34s var(--ease)}
@keyframes enter{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;height:44px}
.brand{font-weight:600;font-size:13px;letter-spacing:.04em;color:var(--fg-2)}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--fg-2);flex:none}
.icon-btn:active{background:var(--fill)}
.icon-btn svg{width:22px;height:22px}

.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
.eyebrow.on{color:var(--fg)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding-block:18px 4px}
.hero-date{font-size:15px;color:var(--fg-2);font-weight:500}
.greet{font-size:clamp(30px,8.8vw,44px);font-weight:600;letter-spacing:-.025em;line-height:1.04;text-wrap:balance}
.status{color:var(--muted);font-size:15px}
.clock{font-size:clamp(76px,24vw,112px);font-weight:300;letter-spacing:-.055em;line-height:.95;font-variant-numeric:tabular-nums;margin-top:26px;margin-left:-.04em}
.clock-cap{font-size:13px;color:var(--muted)}
.hero-cta{margin-top:26px}
.live .clock{margin-top:18px;font-size:clamp(54px,17vw,100px);letter-spacing:-.045em}
.live-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.rec{display:inline-flex;align-items:center;gap:9px}
.rec-dot{width:8px;height:8px;border-radius:50%;background:var(--rec);animation:rec 1.9s ease-out infinite}
@keyframes rec{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--rec) 55%,transparent)}100%{box-shadow:0 0 0 11px color-mix(in srgb,var(--rec) 0%,transparent)}}
.in-time{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--muted);padding:6px 10px;margin-right:-10px;border-radius:12px}
.in-time:active{background:var(--fill)}
.in-time b{font-size:24px;color:var(--fg);font-weight:600;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.mini{display:flex;flex-wrap:wrap;gap:6px 20px;color:var(--muted);font-size:13px;margin:8px 0 16px}
.mini b{color:var(--fg);font-size:17px;font-weight:600;margin-left:6px;font-variant-numeric:tabular-nums}
.done-range{font-size:clamp(42px,12.5vw,60px);font-weight:300;letter-spacing:-.045em;line-height:1;margin-top:14px;font-variant-numeric:tabular-nums}
.done-range span{color:var(--muted);margin:0 .14em}
.done-dur{font-size:clamp(28px,8vw,36px);font-weight:600;letter-spacing:-.02em;line-height:1.15}
.done-dur small,.tile-v small,.kv-v small{font-size:.5em;color:var(--muted);font-weight:500;margin:0 .18em 0 .06em;letter-spacing:0}
.pr-line{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--fg-2);margin-top:6px}
.hero .tiles{margin:18px 0 6px}
.stack{display:grid;gap:4px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:18px;font-size:17px;font-weight:600;letter-spacing:.01em;text-align:center;transition:transform .16s var(--ease),background-color .2s,opacity .2s}
.btn:active{transform:scale(.982)}
.btn svg{width:20px;height:20px}
.btn-primary{background:var(--inv-bg);color:var(--inv-fg)}
.btn-xl{min-height:66px;font-size:18px;border-radius:22px}
.btn-soft{background:var(--fill);color:var(--fg)}
.btn-quiet{min-height:46px;color:var(--fg-2);font-size:15px;font-weight:500}
.btn-danger{background:var(--rec);color:var(--on-rec)}
.btn-soft.danger{color:var(--rec)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* cards & tiles */
.card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px}
.section{margin-top:26px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.section > *,.workout > *,.copy > *{min-width:0}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:13px 14px 12px;display:grid;gap:3px;min-width:0;align-content:start}
.tile-l{font-size:12px;color:var(--muted)}
.tile-v{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.12;white-space:nowrap}
.tile-s{font-size:11.5px;color:var(--muted)}
.last{display:grid;gap:4px;text-align:left;width:100%}
.last-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.last-d{font-size:12px;color:var(--muted)}
.last-t{font-size:20px;font-weight:600;letter-spacing:-.01em;margin-top:4px}
.last-l{font-size:13px;color:var(--fg-2);line-height:1.6}
.last-m{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.howto{display:grid;gap:14px}
.steps{list-style:none;padding:0;display:grid;gap:14px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:2px 12px;counter-increment:s}
.steps li::before{content:counter(s);grid-row:1/3;width:28px;height:28px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--fg-2)}
.steps b{font-weight:600;font-size:15px}
.steps span{font-size:13px;color:var(--muted)}

.notice{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 12px 12px 14px;border-radius:16px;background:var(--fill);font-size:13px;color:var(--fg-2);margin-top:6px}
.notice div{display:grid;gap:1px}
.notice b{color:var(--fg);font-weight:600;font-size:14px}
.notice-btn{flex:none;min-height:36px;padding:0 12px;border-radius:11px;background:var(--card);color:var(--fg);font-weight:600;font-size:13px;box-shadow:var(--shadow);white-space:nowrap}
.notice.warn{background:color-mix(in srgb,var(--rec) 12%,var(--card));color:var(--fg)}

/* workout editor */
.workout{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:22px}
.rest-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 10px 10px 16px;background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
.rr-t{font-size:14px;font-weight:600}
.rr-s{font-size:11.5px;color:var(--muted)}
.seg{display:flex;gap:3px;background:var(--fill);padding:3px;border-radius:12px;flex:none}
.seg button{min-width:42px;height:32px;padding:0 6px;border-radius:9px;font-family:var(--mono);font-size:13px;color:var(--fg-2);text-align:center}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.1)}

.copy{display:grid;gap:10px}
.copy .eyebrow{padding:6px 4px 0}
.mo{display:grid;gap:4px;width:100%;text-align:left;padding:16px;background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);transition:transform .16s var(--ease)}
.mo:active{transform:scale(.99)}
.mo-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mo-t{font-weight:600;font-size:16px}
.mo-d{font-size:12px;color:var(--muted);white-space:nowrap}
.mo-l{font-size:13px;color:var(--fg-2);line-height:1.6}
.mo-go{margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:15px;background:var(--inv-bg);color:var(--inv-fg);font-weight:600;font-size:15px}
.mo-go svg{width:18px;height:18px}
.mo.small{padding:12px 16px}
.mo.small .mo-t{font-size:15px}
.empty-ex{padding:20px 6px 4px;font-size:14px;color:var(--muted);text-align:center}

.ex{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px 16px 10px;display:grid;gap:14px;scroll-margin-top:24px}
.ex-h{display:grid;gap:1px;min-width:0;justify-items:start}
.ex-guide{display:inline-flex;align-items:center;gap:1px;font-size:12.5px;color:var(--fg-2);padding:5px 0 0}
.ex-guide svg{width:14px;height:14px}
.ex-en{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase}
.ex-name{font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.3;margin-top:1px}
.g-sec{display:grid;gap:10px;margin-top:22px}
.g-sec h3{font-size:13px;color:var(--muted);font-weight:500;padding:0 4px}
.muscles{display:flex;flex-wrap:wrap;gap:6px}
.mchip{font-size:13.5px;background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:6px 13px}
.points{list-style:none;padding:0 16px;margin:0;display:grid;background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
.points li{display:grid;grid-template-columns:8px 1fr;gap:12px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.55}
.points li:last-child{border-bottom:0}
.points li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fg);transform:translateY(-2px)}
.g-actions{margin-top:22px}
.prev{display:grid;gap:8px;padding:11px 12px;border-radius:14px;background:var(--fill-2)}
.prev-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.prev-sets{display:flex;flex-wrap:wrap;gap:6px}
.pchip{font-family:var(--mono);font-size:13px;padding:4px 9px;border-radius:9px;background:var(--card);color:var(--fg-2);font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.pchip.is-next{box-shadow:inset 0 0 0 1.5px var(--fg);color:var(--fg)}
.prev.is-empty{font-size:12.5px;color:var(--muted)}
.sets{list-style:none;padding:0;display:grid}
.set{display:grid;grid-template-columns:24px minmax(0,1fr) auto 34px;align-items:center;gap:8px;min-height:46px;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set.is-new{animation:rowin .5s var(--ease)}
@keyframes rowin{from{opacity:.001;transform:translateY(-8px)}to{opacity:1;transform:none}}
.set-n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.set-v{font-size:21px;font-weight:500;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.set-v small{font-size:13px;color:var(--muted);margin-left:2px}
.set-v .x{color:var(--muted);margin:0 7px;font-weight:400;font-size:16px}
.set-v .bw{font-size:16px}
.set-tags{display:flex;gap:6px;align-items:center}
.up{font-family:var(--mono);font-size:11.5px;color:var(--fg-2);white-space:nowrap}
.badge-pr{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.12em;color:var(--pr);background:var(--pr-wash);padding:3px 7px;border-radius:6px;white-space:nowrap}
.set-del{width:34px;height:34px;color:var(--muted);border-radius:10px;display:grid;place-items:center}
.set-del svg{width:16px;height:16px}
.set-del:active{background:var(--fill)}
.target{grid-column:1/-1;font-size:12.5px;color:var(--muted);padding-left:4px}
.target b{font-family:var(--mono);font-weight:500;color:var(--fg);margin-left:6px}
.entry{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:6px;min-width:0}
.flabel{font-size:12px;color:var(--muted);padding-left:4px}
.stepper{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;height:56px;border-radius:var(--r-ctl);background:var(--fill);transition:box-shadow .2s}
.stepper:focus-within{box-shadow:inset 0 0 0 1.5px var(--fg)}
.stepper button{height:100%;font-size:24px;line-height:1;color:var(--fg-2);text-align:center;border-radius:var(--r-ctl)}
.stepper button:active{color:var(--fg);background:color-mix(in srgb,var(--fg) 6%,transparent)}
.stepper input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;padding:0;outline:none;-moz-appearance:textfield}
.stepper input::placeholder{color:var(--muted);font-weight:400}
.btn-log{grid-column:1/-1;min-height:54px;border-radius:16px;background:var(--inv-bg);color:var(--inv-fg);font-weight:600;font-size:16px;text-align:center;transition:transform .16s var(--ease)}
.btn-log:active{transform:scale(.982)}
.ex-foot{display:flex;gap:2px;justify-content:flex-end}
.link-btn{font-size:13px;color:var(--muted);padding:8px 10px;border-radius:10px}
.link-btn:active{background:var(--fill)}
.memo{display:block;width:100%;min-height:64px;border:0;border-radius:12px;background:var(--fill-2);padding:10px 12px;resize:vertical;font-size:16px;line-height:1.5;outline:none}
.memo:focus{box-shadow:inset 0 0 0 1.5px var(--fg)}
.shake{animation:shake .38s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.btn-add svg{width:18px;height:18px}
.end-bottom{margin-top:6px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:58px}
.tab{display:grid;justify-items:center;align-content:center;gap:2px;font-size:10.5px;color:var(--muted);position:relative;text-align:center}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--fg)}
.live-dot{position:absolute;top:8px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--rec);box-shadow:0 0 0 2px var(--bg)}

/* rest timer */
.rest{position:fixed;z-index:25;left:16px;right:16px;margin-inline:auto;max-width:520px;bottom:calc(70px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;padding:9px 9px 9px 11px;border-radius:24px;background:var(--inv-bg);color:var(--inv-fg);box-shadow:var(--pop-shadow)}
.rest.pop{animation:pillin .42s var(--ease)}
@keyframes pillin{from{opacity:.001;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.rest-ring{width:42px;height:42px;transform:rotate(-90deg);flex:none}
.rest-ring circle{fill:none;stroke-width:3.4}
.rest-ring .trk{stroke:color-mix(in srgb,var(--inv-fg) 18%,transparent)}
.rest-ring .prg{stroke:var(--inv-fg);stroke-linecap:round;transition:stroke-dashoffset .5s linear}
.rest-txt{flex:1;display:grid;line-height:1.15;min-width:0}
.rest-l{font-size:11px;opacity:.7;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest-t{font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rest button{height:40px;min-width:46px;padding:0 8px;border-radius:13px;background:color-mix(in srgb,var(--inv-fg) 13%,transparent);font-family:var(--mono);font-size:13px;text-align:center;display:grid;place-items:center}
.rest button svg{width:16px;height:16px}
.rest.is-done{animation:done 1s ease-in-out 3}
@keyframes done{50%{transform:scale(1.025)}}

/* toast */
.toast{position:fixed;z-index:40;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top,0px));max-width:420px;margin-inline:auto;padding:12px 12px 12px 16px;border-radius:18px;background:var(--inv-bg);color:var(--inv-fg);font-size:14px;display:flex;align-items:center;gap:12px;min-height:50px;box-shadow:var(--pop-shadow);transform:translateY(-150%);opacity:0;pointer-events:none;transition:transform .42s var(--ease),opacity .3s}
.toast.show{transform:none;opacity:1;pointer-events:auto}
.t-act{margin-left:auto;font-weight:600;padding:7px 11px;border-radius:11px;background:color-mix(in srgb,var(--inv-fg) 14%,transparent);white-space:nowrap}
.toast.pr{display:grid;justify-items:center;text-align:center;gap:3px;padding:18px 16px 16px;background:var(--card);color:var(--fg);box-shadow:0 0 0 1px var(--pr-wash),var(--pop-shadow)}
.toast.pr.show{animation:prpop .55s var(--ease)}

.pr-badge{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.2em;color:var(--pr);background:var(--pr-wash);padding:4px 10px;border-radius:7px}
.pr-name{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--muted);margin-top:8px}

.pr-vals b{font-weight:600}

/* sheet */
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}

.sheet-panel{position:relative;width:100%;max-width:560px;max-height:min(90vh,880px);overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:26px 26px 0 0;padding:8px 20px calc(28px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .36s var(--ease)}
.sheet.open .sheet-scrim{opacity:1}
.sheet.open .sheet-panel{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--bar);margin:2px auto 12px}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.sheet-h h2{font-size:23px;font-weight:600;letter-spacing:-.015em;line-height:1.25;text-wrap:balance}
.sheet-h .eyebrow{margin-bottom:4px}
.sheet-h .icon-btn{margin:-4px -8px 0 0}
.muted{color:var(--muted);font-size:14px}

.search input{width:100%;height:50px;border-radius:15px;border:0;background:var(--fill);padding:0 16px;font-size:16px;outline:none}
.search input:focus{box-shadow:inset 0 0 0 1.5px var(--fg)}
.group-l{font-size:12px;color:var(--muted);margin:20px 4px 8px}
.pick-list{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:0 14px}
.pick{display:grid;padding:6px 0;border-bottom:1px solid var(--line)}
.pick-part{justify-self:start;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-2);padding:2px 0 6px}
.pick-part b{font-weight:600;color:var(--fg);background:var(--fill);border-radius:6px;padding:1px 7px}
.pick-main{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:1px 12px;width:100%;text-align:left;padding:4px 0;min-height:48px}
.pick:last-child{border-bottom:0}
.pick-n{font-size:16px;font-weight:500}
.pick-s{font-size:12px;color:var(--muted);grid-column:1;font-variant-numeric:tabular-nums}
.pick-last{grid-column:1;display:flex;flex-wrap:wrap;align-items:center;gap:4px 5px;margin-top:4px}
.pl-d{font-size:11.5px;color:var(--muted);margin-right:2px;white-space:nowrap}
.pl-c{font-family:var(--mono);font-size:12px;line-height:1.5;color:var(--fg);background:var(--fill);border-radius:7px;padding:1px 6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pl-m{font-size:11.5px;color:var(--muted)}
.pick-new{display:grid;gap:2px;min-width:0;padding:4px 0}
.part-pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.part-pick .chip{height:32px;padding:0 12px}
.g-btn .g-t,.g-btn .g-s{display:block}
.suggest{display:grid;gap:12px}
.sg-t{font-size:14px;color:var(--fg-2);line-height:1.6}
.sg-pick{display:grid;gap:2px;padding:12px 14px;border-radius:14px;background:var(--fill-2)}
.sg-l{font-size:12px;color:var(--muted)}
.sg-n{font-size:21px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.sg-s{font-size:13px;color:var(--fg-2);line-height:1.6}
.sg-d{font-size:12px;color:var(--muted);margin-top:2px}
.suggest .btn{min-height:50px;font-size:15px;white-space:nowrap}
.suggest .two{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)}
.pick-hint{font-size:12.5px;color:var(--muted);padding:12px 4px 0}
.part-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.part-opt{min-height:58px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-size:16px;font-weight:600;text-align:center;transition:transform .16s var(--ease)}
.part-opt:active{transform:scale(.97)}
.part-opt.on{background:var(--inv-bg);color:var(--inv-fg)}
.pi{grid-row:1/3;grid-column:2;color:var(--fg-2);display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--fill)}
.pi svg{width:16px;height:16px}
.pick-main:disabled{opacity:.45}
.pick-on{grid-row:1/3;grid-column:2;font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:999px;background:var(--fill);font-size:13px;color:var(--fg-2);white-space:nowrap;text-align:center}
.chip.on{background:var(--inv-bg);color:var(--inv-fg)}
.part-tabs{margin:18px -20px 0;padding:0 20px}

.end-sum{display:grid;justify-items:center;gap:4px;padding:8px 0 18px;text-align:center}
.end-times{font-size:clamp(40px,12vw,54px);font-weight:300;letter-spacing:-.045em;line-height:1.05;font-variant-numeric:tabular-nums}
.end-times i{font-style:normal;color:var(--muted);margin:0 .2em;font-size:.6em;vertical-align:.12em}
.end-dur{font-size:15px;color:var(--muted)}
.end-dur b{color:var(--fg);font-weight:600;font-size:18px;margin-left:6px}
.end-note{font-size:12px;color:var(--muted)}
.end-meta{display:flex;justify-content:center;gap:18px;font-size:13px;color:var(--muted);margin-bottom:14px}

.dt{display:grid;gap:12px;padding-bottom:20px}
.dt + .dt{border-top:1px solid var(--line);padding-top:20px}

.dt-meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted);padding:0 4px}
.dt-meta b{color:var(--fg);font-weight:600;margin-left:5px}
.dt-list{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:2px 16px}
.dt-ex{padding:13px 0;border-bottom:1px solid var(--line)}
.dt-ex:last-child{border-bottom:0}
.dt-ex-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dt-ex-h b{font-size:15px;font-weight:600}
.dt-ex-h span{font-size:12px;color:var(--muted);white-space:nowrap}
.dt-sets{list-style:none;padding:0;margin-top:6px;display:grid;gap:3px}
.dt-sets li{display:flex;align-items:center;gap:10px;font-size:15px;font-variant-numeric:tabular-nums}
.dt-sets .n{font-family:var(--mono);font-size:11px;color:var(--muted);width:14px}
.dt-sets small{font-size:12px;color:var(--muted);margin-left:1px}
.dt-sets .x{color:var(--muted);margin:0 2px}
.dt-memo{font-size:13px;color:var(--fg-2);background:var(--fill-2);border-radius:10px;padding:8px 10px;margin-top:8px;white-space:pre-wrap}
.confirm-t{font-size:14px;color:var(--fg-2);text-align:center;padding:4px 0 10px}
.tag{display:inline-block;font-size:10.5px;font-weight:500;color:var(--fg-2);background:var(--fill);border-radius:6px;padding:1px 7px;vertical-align:.15em;margin-left:6px;letter-spacing:.02em}

/* settings */
.group{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:0 16px}
.group + .group{margin-top:14px}
.g-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.g-row:last-child{border-bottom:0}
.g-t{font-size:15px}
.g-s{font-size:12px;color:var(--muted);margin-top:1px}
.g-btn{cursor:pointer;font-size:15px}
.g-btn.danger{color:var(--rec)}
.g-confirm{display:grid;gap:10px;padding:14px 0}
.switch{flex:none;width:51px;height:31px;border-radius:999px;background:var(--fill);position:relative;transition:background-color .22s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:var(--thumb-off);box-shadow:0 2px 5px rgba(0,0,0,.18);transition:transform .26s var(--ease),background-color .22s}
.switch[aria-checked="true"]{background:var(--fg)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--bg)}

/* calendar */
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:22px 16px}
.page-h h1{font-size:32px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.page-h .h-sub{font-size:16px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:8px}
.cal{padding:14px 10px 8px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px}
.cal-title{font-size:19px;font-weight:600;letter-spacing:-.01em}
.cal-title span{color:var(--muted);font-weight:500;margin-right:6px;font-size:15px}
.cal-nav-btns{display:flex;gap:2px}
.cal-wd,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-wd span{text-align:center;font-size:11px;color:var(--muted);padding-bottom:6px}
.cal-grid{row-gap:2px}
.day{display:grid;justify-items:center;align-content:start;gap:4px;padding:5px 0 9px;border-radius:13px;min-height:54px;text-align:center}
.day:not(:disabled):active,.day.sel{background:var(--fill)}
.day-n{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;font-size:15px;font-variant-numeric:tabular-nums}
.day.today .day-n{background:var(--inv-bg);color:var(--inv-fg);font-weight:600}
.day.future .day-n{color:var(--muted);opacity:.6}
.mk{width:7px;height:7px;border-radius:50%;display:block}
.mk.train{background:var(--fg)}
.mk.visit{box-shadow:inset 0 0 0 1.5px var(--fg)}
.mk.rest{width:9px;height:1.5px;border-radius:1px;background:var(--muted);margin-top:3px}
.mk.none{visibility:hidden}
.legend{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:10px 0 6px;border-top:1px solid var(--line);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.list{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);padding:0 16px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row-date{display:grid;justify-items:center;width:34px;line-height:1.15}
.row-date b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.row-date span{font-size:11px;color:var(--muted)}
.row-main{min-width:0;display:grid}
.row-t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--muted);display:grid}
.chev svg{width:16px;height:16px}
.sec-l{font-size:13px;color:var(--muted);margin:0 4px -4px}
.empty{display:grid;gap:12px;justify-items:center;text-align:center;padding:30px 20px}
.empty p{font-size:14px;color:var(--muted);max-width:30ch}

/* stats */
.cc-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.cc-h h3{font-size:16px;font-weight:600}
.cc-s{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chart-card .chips{margin:14px -18px 0;padding:0 18px}
.chart{position:relative;height:172px;margin-top:12px}
.chart svg{display:block;overflow:visible}
.chart .ax{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--bar);transition:fill .15s}
.chart .bar.cur,.chart .bar.is-hot{fill:var(--fg)}
.chart .avg{stroke:var(--fg-2);stroke-width:1}
.chart .ln{fill:none;stroke:var(--fg);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--fg);opacity:.06}
.chart .pt{fill:var(--fg);stroke:var(--card);stroke-width:2;transition:r .15s}
.chart .pt.pr{fill:var(--pr)}
.chart .pt.is-hot{r:6px}
.chart .lbl{font-size:12px;font-weight:600;fill:var(--fg);font-variant-numeric:tabular-nums}
.chart .hit{fill:transparent;cursor:pointer}
.chart-empty{display:grid;place-items:center;height:100%;font-size:13px;color:var(--muted)}
.tip{position:absolute;left:0;top:0;pointer-events:none;transform:translate(-50%,calc(-100% - 10px));background:var(--inv-bg);color:var(--inv-fg);font-size:12px;padding:6px 10px;border-radius:10px;white-space:nowrap;opacity:0;transition:opacity .15s;font-variant-numeric:tabular-nums}
.tip.show{opacity:1}
.chart-key{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:8px}
.chart-key span{display:inline-flex;align-items:center;gap:6px}
.chart-key i{width:8px;height:8px;border-radius:50%;background:var(--fg);display:block}
.chart-key i.pr{background:var(--pr)}
.chart-key i.line{width:14px;height:1px;border-radius:0;background:var(--fg-2)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv-n{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv-s{font-size:12px;color:var(--muted)}
.kv-v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;letter-spacing:-.01em}
.kv-v .from{color:var(--muted);font-weight:400}
.kv-v .arr{color:var(--muted);margin:0 6px;font-weight:400}

/* edit view */
.edit-top{display:flex;align-items:center;height:44px;margin-left:-8px}
.back{display:inline-flex;align-items:center;gap:2px;font-size:16px;color:var(--fg);padding:8px;border-radius:10px}
.back svg{width:20px;height:20px}
.times-edit{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.time-field{display:grid;gap:6px}
.time-field span{font-size:12px;color:var(--muted);padding-left:4px}
.time-field input{height:54px;border-radius:14px;border:0;background:var(--fill);padding:0 14px;font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;width:100%;min-width:0;outline:none}
.time-field input:focus{box-shadow:inset 0 0 0 1.5px var(--fg)}
.time-field input:disabled{opacity:.5}
.te-dur{grid-column:1/-1;font-size:13px;color:var(--muted);padding-left:4px}
.te-dur b{color:var(--fg);font-weight:600;margin-left:6px}
.edit-done{margin-top:18px}

@media (min-width:700px){
  .app{padding-top:24px}
  .tabbar-in{height:62px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>

<body>


<div class="app">
  <main id="view" class="view" aria-live="off"></main>
</div>

<div id="rest" class="rest" hidden role="timer" aria-label="休憩タイマー">
  <svg class="rest-ring" viewBox="0 0 36 36" aria-hidden="true"><circle class="trk" cx="18" cy="18" r="15"/><circle class="prg" cx="18" cy="18" r="15" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/></svg>
  <div class="rest-txt"><span class="rest-l">休憩</span><span class="rest-t">0:00</span></div>
  <button data-act="restAdd" data-d="-15" aria-label="15秒減らす">−15</button>
  <button data-act="restAdd" data-d="15" aria-label="15秒増やす">+15</button>
  <button data-act="restStop" aria-label="休憩タイマーを止める"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
</div>

<nav class="tabbar" aria-label="画面の切り替え">
  <div class="tabbar-in">
    <button class="tab" data-act="tab" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <span>今日</span><i id="liveDot" class="live-dot" hidden></i>
    </button>
    <button class="tab" data-act="tab" data-tab="calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
      <span>カレンダー</span>
    </button>
    <button class="tab" data-act="tab" data-tab="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><path d="M5.5 19.5v-7M12 19.5V5M18.5 19.5v-10"/></svg>
      <span>統計</span>
    </button>
  </div>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-scrim" data-act="closeSheet"></div>
  <div id="sheetPanel" class="sheet-panel" role="dialog" aria-modal="true"></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ============================================================
   1. Utilities
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const U = {
  pad: n => String(n).padStart(2, '0'),
  key(t) { const d = new Date(t); return `${d.getFullYear()}-${U.pad(d.getMonth() + 1)}-${U.pad(d.getDate())}`; },
  fromKey(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); },
  hm(t) { const d = new Date(t); return `${U.pad(d.getHours())}:${U.pad(d.getMinutes())}`; },
  md(t) { const d = new Date(t); return `${d.getMonth() + 1}月${d.getDate()}日`; },
  mdS(t) { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}`; },
  wd(t) { return '日月火水木金土'[new Date(t).getDay()]; },
  mins(ms) { return Math.max(0, Math.round(ms / 60000)); },
  dur(ms) { const m = U.mins(ms), h = Math.floor(m / 60), r = m % 60; return h ? `${h}時間${r}分` : `${r}分`; },
  durS(ms) { const m = U.mins(ms), h = Math.floor(m / 60), r = m % 60; return h ? `${h}h ${r}m` : `${r}m`; },
  durH(ms) { const m = U.mins(ms), h = Math.floor(m / 60), r = m % 60; return h ? `${h}<small>h</small>${r}<small>m</small>` : `${r}<small>m</small>`; },
  clock(ms) { const s = Math.max(0, Math.floor(ms / 1000)); return `${U.pad(Math.floor(s / 3600))}:${U.pad(Math.floor(s / 60) % 60)}:${U.pad(s % 60)}`; },
  mmss(ms) { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${U.pad(s % 60)}`; },
  w(n) { return String(Math.round(n * 100) / 100); },
  n(n) { return Math.round(n).toLocaleString('ja-JP'); },
  id() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); },
  esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
  greet(t) { const h = new Date(t).getHours(); return h >= 4 && h < 11 ? 'Good Morning' : h >= 11 && h < 17 ? 'Good Afternoon' : 'Good Evening'; },
  day0(t) { const d = new Date(t); d.setHours(0, 0, 0, 0); return d; },
  addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; },

/* ============================================================
   3. Store — localStorage first, private cloud copy when available
   ============================================================ */
const LS = { data: 'kintore-diary.v1', rest: 'kintore-diary.rest' };
const DEFAULT_SETTINGS = { restAuto: true, restSec: 90, step: 2.5, wake: false, restSound: true };
const normMeta = m => ({ activeId: m?.activeId ?? null, settings: { ...DEFAULT_SETTINGS, ...(m?.settings || {}) }, custom: { ...(m?.custom || {}) }, updatedAt: m?.updatedAt || 0 });
const blankState = () => ({ v: 1, sessions: {}, meta: normMeta(null) });

const Store = {
  state: blankState(),
  rev: 1,
  localOK: true,
  subs: new Set(),
  get meta() { return this.state.meta; },
  get settings() { return this.state.meta.settings; },
  load() {
    this.localOK = lsSet('kintore-diary.probe', '1');
    const raw = lsGet(LS.data);
    if (!raw) return;
    try {
      const s = JSON.parse(raw);
      if (s && s.v === 1) this.state = { v: 1, sessions: s.sessions || {}, meta: normMeta(s.meta) };
    } catch {}
    this.rev++;
  },
  persist() { this.localOK = lsSet(LS.data, JSON.stringify(this.state)); },
  /* Every change goes through here: stamp, save locally, queue cloud write, re-render. */
  commit({ sessions = [], meta = false, silent = false } = {}) {
    const now = Date.now();
    for (const id of sessions) { const s = this.state.sessions[id]; if (s) s.updatedAt = now; }
    if (meta) this.state.meta.updatedAt = now;
    this.rev++;
    this.persist();
    Cloud.queue(sessions, meta);
    if (!silent) this.emit(false);
  },
  emit(remote) { this.subs.forEach(f => f(remote)); },
};

const Model = {
  get: id => Store.state.sessions[id],
  newSession(start, end = null) {
    return { id: U.id(), date: U.key(start), start, end, exercises: [], memo: '', updatedAt: 0 };
  },
  start(t = Date.now()) {
    const s = this.newSession(t);
    Store.state.sessions[s.id] = s;
    Store.meta.activeId = s.id;
    Store.commit({ sessions: [s.id], meta: true });
    return s;
  },
  createPast(start, end) {
    const s = this.newSession(start, end);
    Store.state.sessions[s.id] = s;
    Store.commit({ sessions: [s.id] });
    return s;
  },
  finish(id, t = Date.now()) {
    const s = this.get(id); if (!s) return;
    s.end = Math.max(t, s.start + 60000);
    if (Store.meta.activeId === id) Store.meta.activeId = null;
    Store.commit({ sessions: [id], meta: true });
  },
  tombstone(s) { return { id: s.id, date: s.date, start: s.start, deleted: true, exercises: [], updatedAt: 0 }; },
  remove(ids) {
    let meta = false;
    for (const id of ids) {
      const s = this.get(id); if (!s) continue;
      Store.state.sessions[id] = this.tombstone(s);
      if (Store.meta.activeId === id) { Store.meta.activeId = null; meta = true; }
    }
    Store.commit({ sessions: ids, meta });
  },
  addExercise(sid, name) {
    const s = this.get(sid);
    const e = { id: U.id(), name, sets: [], memo: '' };
    s.exercises.push(e);
    Store.commit({ sessions: [sid] });
    return e;
  },
};

/* Optional cloud copy: each signed-in viewer's private subtree on claude.ai.
   One document per month ("m2026-10") plus one "meta" document. Newer updatedAt wins. */
const Cloud = {
  col: null, status: 'off', pending: new Set(), metaDirty: false, timer: 0, busy: false,
  month: s => 'm' + s.date.slice(0, 7),
  label() {
    if (this.status === 'off') return Store.localOK ? 'この端末に保存しています' : 'この環境では保存できません。閉じると記録が消えます';
    if (this.status === 'syncing') return 'このブラウザ＋あなた専用のクラウド領域（同期中）';
    if (this.status === 'error') return 'クラウドに同期できませんでした。このブラウザには保存されています';
    return 'このブラウザ＋あなた専用のクラウド領域（同期済み）';
  },
  setStatus(s) { this.status = s; if (Sheet.fn === settingsSheet) Sheet.refresh(); },
  async init() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return;
    let db = null, user = null;
    try { [db, user] = await Promise.all([c.use('db'), c.use('user')]); } catch { return; }
    if (!db || !user) return;
    let uid = null;
    try { uid = await user.id(); } catch {}
    if (!uid) return;
    try { this.col = db.collection('data/users/' + uid); } catch { this.col = null; return; }
    this.setStatus('syncing');
    try {
      const snap = await this.col.limit(1000).get();
      const r = this.merge(snap.docs, true);
      r.push.forEach(m => this.pending.add(m));
      if (r.pushMeta) this.metaDirty = true;
      if (r.changed) { Store.rev++; Store.persist(); Store.emit(true); }
      await this.flush();
      this.col.limit(1000).onSnapshot(qs => {
        const m = this.merge(qs.docs, false);
        if (m.changed) { Store.rev++; Store.persist(); Store.emit(true); }
      }, () => {});
    } catch { this.setStatus('error'); }
  },
  merge(docs, collect) {
    const st = Store.state;
    let changed = false, pushMeta = false;
    const push = new Set(), rs = {};
    let rm = null;
    for (const d of docs) {
      if (!d.exists) continue;
      const b = d.data(); if (!b) continue;
      if (d.id === 'meta') rm = b;
      else if (b.sessions && typeof b.sessions === 'object') Object.assign(rs, b.sessions);
    }
    for (const [id, r] of Object.entries(rs)) {
      if (!r || typeof r.start !== 'number' || !r.date) continue;
      const l = st.sessions[id];
      if (!l || (r.updatedAt || 0) > (l.updatedAt || 0)) {
        const copy = U.clone(r); copy.exercises = copy.exercises || [];
        st.sessions[id] = copy; changed = true;
      } else if (collect && (l.updatedAt || 0) > (r.updatedAt || 0)) push.add(this.month(l));
    }
    if (collect) for (const l of Object.values(st.sessions)) if (!rs[l.id]) push.add(this.month(l));
    if (rm && (rm.updatedAt || 0) > (st.meta.updatedAt || 0)) { st.meta = normMeta(rm); changed = true; }
    else if (collect && st.meta.updatedAt && (!rm || st.meta.updatedAt > (rm.updatedAt || 0))) pushMeta = true;
    return { changed, push, pushMeta };
  },
  queue(ids, meta) {
    if (!this.col) return;
    for (const id of ids) { const s = Store.state.sessions[id]; if (s) this.pending.add(this.month(s)); }
    if (meta) this.metaDirty = true;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), 700);
  },
  async flush() {
    if (!this.col) return;
    if (this.busy) { clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 700); return; }
    if (!this.pending.size && !this.metaDirty) { this.setStatus('synced'); return; }
    this.busy = true; this.setStatus('syncing');
    let ok = true;
    try {
      for (const m of [...this.pending]) {
        this.pending.delete(m);
        const sessions = {};
        for (const s of Object.values(Store.state.sessions)) if (this.month(s) === m) sessions[s.id] = s;
        if (!(await this.write(m, { sessions }))) { this.pending.add(m); ok = false; }
      }
      if (this.metaDirty) {
        this.metaDirty = false;
        const mt = Store.meta;
        if (!(await this.write('meta', { activeId: mt.activeId, settings: mt.settings, custom: mt.custom, updatedAt: mt.updatedAt }))) { this.metaDirty = true; ok = false; }
      }
    } finally { this.busy = false; }
    this.setStatus(ok ? 'synced' : 'error');
  },
  async write(id, body) {
    for (let a = 0; a < 2; a++) {
      try { await this.col.doc(id).set(U.clone(body)); return true; }
      catch (e) {
        if (e?.code !== 'unavailable' || a) return false;
        await new Promise(r => setTimeout(r, 600 + Math.random() * 600));
      }
    }
    return false;
  },
};

/* ============================================================
   4. Queries & analytics
   ============================================================ */
const Q = {
  _rev: 0, _all: [], _srev: 0, _st: null,
  all() {
    if (this._rev !== Store.rev) {
      this._all = Object.values(Store.state.sessions).filter(s => !s.deleted).sort((a, b) => a.start - b.start);
      this._rev = Store.rev;
    }
    return this._all;
  },
  active() { const id = Store.meta.activeId; const s = id && Store.state.sessions[id]; return s && !s.deleted && !s.end ? s : null; },
  onDate(k) { return this.all().filter(s => s.date === k); },
  sets(s) { return s.exercises.reduce((n, e) => n + e.sets.length, 0); },
  volume(s) { return s.exercises.reduce((v, e) => v + e.sets.reduce((a, x) => a + x.w * x.r, 0), 0); },
  trained(s) { return this.sets(s) > 0; },
  lastSetAt(s) { let t = 0; s.exercises.forEach(e => e.sets.forEach(x => { if (x.at > t) t = x.at; })); return t; },
  prev(name, s) {
    const list = this.all();
    for (let i = list.length - 1; i >= 0; i--) {
      const o = list[i];
      if (o.id === s.id || o.start >= s.start) continue;
      const e = o.exercises.find(x => x.name === name && x.sets.length);
      if (e) return { s: o, e };
    }
    return null;
  },
  best(name, s) {
    let b = null;
    for (const o of this.all()) {
      if (o.id === s.id || o.start >= s.start) continue;
      for (const e of o.exercises) if (e.name === name) for (const x of e.sets) if (b === null || x.w > b) b = x.w;
    }
    return b;
  },
  prFlags(s, e) {
    const b = this.best(e.name, s);
    let m = -Infinity;
    return e.sets.map(x => { const pr = b !== null && x.w > Math.max(b, m); m = Math.max(m, x.w); return pr; });
  },
  prCount(s) { return s.exercises.filter(e => this.prFlags(s, e).some(Boolean)).length; },
  menus(s, n = 4) {
    const out = [], seen = new Set(), list = this.all();
    for (let i = list.length - 1; i >= 0 && out.length < n; i--) {
      const o = list[i];
      if (o.id === s.id || !o.exercises.length) continue;
      const sig = o.exercises.map(e => e.name).join('|');
      if (seen.has(sig)) continue;
      seen.add(sig); out.push(o);
    }
    return out;
  },
  title(s) {
    const ps = [...new Set(s.exercises.map(e => Lib.part(e.name)))].filter(p => p !== 'other').map(p => PARTS[p]);
    return ps.length ? ps.join('・') : s.exercises.length ? 'トレーニング' : '来館のみ';
  },
  dayState(k) { const ss = this.onDate(k); if (!ss.length) return null; return ss.some(s => this.trained(s)) ? 'train' : 'visit'; },
  firstDate() { const a = this.all(); return a.length ? a[0].date : null; },
  hasSamples() { return this.all().some(s => s.sample); },
  avgStartMin() {
    const a = this.all().slice(-12); if (!a.length) return null;
    return Math.round(a.reduce((t, s) => t + (s.start - U.day0(s.start).getTime()) / 60000, 0) / a.length);
  },
  stats() {
    if (this._srev === Store.rev && this._st) return this._st;
    const all = this.all(), now = Date.now();
    const days = new Set(all.map(s => s.date));
    const ym = U.key(now).slice(0, 7);
    const ws = U.weekStart(now), we = U.addDays(ws, 7);
    const month = [...days].filter(k => k.startsWith(ym)).length;
    const week = [...days].filter(k => { const t = U.fromKey(k); return t >= ws && t < we; }).length;
    const ended = all.filter(s => s.end);
    const total = ended.reduce((a, s) => a + (s.end - s.start), 0);
    const avg = ended.length ? total / ended.length : 0;
    const sets = all.reduce((a, s) => a + this.sets(s), 0);
    let streak = 0, d = U.day0(now);
    if (!days.has(U.key(d))) d = U.addDays(d, -1);
    while (days.has(U.key(d))) { streak++; d = U.addDays(d, -1); }
    let longest = 0, run = 0, prevK = null;
    for (const k of [...days].sort()) {
      run = prevK && U.key(U.addDays(U.fromKey(prevK), 1)) === k ? run + 1 : 1;
      longest = Math.max(longest, run); prevK = k;
    }
    const ex = new Map();
    for (const s of all) for (const e of s.exercises) {
      if (!e.sets.length) continue;
      const top = Math.max(...e.sets.map(x => x.w));
      const reps = Math.max(...e.sets.filter(x => x.w === top).map(x => x.r));
      let r = ex.get(e.name);
      if (!r) { r = { name: e.name, best: -1, bestReps: 0, bestAt: 0, history: [], count: 0 }; ex.set(e.name, r); }
      r.count++;
      r.history.push({ t: s.start, top, reps });
      if (top > r.best || (top === r.best && reps > r.bestReps)) { r.best = top; r.bestReps = reps; r.bestAt = s.start; }
    }
    const improved = [...ex.values()]
      .filter(r => r.history.length > 1 && r.history.at(-1).top > r.history.at(-2).top)
      .map(r => ({ name: r.name, from: r.history.at(-2).top, to: r.history.at(-1).top, t: r.history.at(-1).t }))
      .sort((a, b) => b.t - a.t);
    this._st = { count: all.length, month, week, total, avg, sets, streak, longest, ex, improved };
    this._srev = Store.rev;
    return this._st;
  },
};

/* "今日は筋トレどうしますか？" — suggests the menu done longest ago among recent ones */
const Suggest = {
  key: 'kintore-diary.restday',
  skipped() { return lsGet(this.key) === U.key(Date.now()); },
  skip() { lsSet(this.key, U.key(Date.now())); },
  unskip() { lsSet(this.key, ''); },
  get() {
    const done = Q.all().filter(s => s.end && s.exercises.length);
    if (!done.length) return null;
    const today0 = U.day0(Date.now());
    const last = done[done.length - 1];
    const gap = Math.round((today0 - U.day0(last.start)) / 864e5);
    if (gap < 1) return null;
    const since = Date.now() - 42 * 864e5, byTitle = new Map();
    for (const s of done) if (s.start >= since) byTitle.set(Q.title(s), s);
    const cands = [...byTitle.values()].sort((a, b) => a.start - b.start);
    const pick = cands.length > 1 ? cands[0] : last;
    const days = new Set(Q.all().map(s => s.date));
    let streak = 0, d = U.addDays(today0, -1);
    while (days.has(U.key(d))) { streak++; d = U.addDays(d, -1); }
    return { last, gap, pick, streak };
  },
};

/* Rest-timer beep: two short tones ("pi-pip"), queued on the audio clock when the
   timer starts so it lands exactly on zero. It mixes with music from other apps.
   Browsers only play it while the app is open, and iPhone mutes it in silent mode. */
const Sound = {
  ctx: null, pending: [], unlocked: false, onReady: null,
  get on() { return Store.settings.restSound !== false; },
  prime() {
    try {
      if (!this.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return Promise.resolve(); this.ctx = new C(); }
      const c = this.ctx;
      if (!this.unlocked) { // iOS: play one silent sample inside the tap to unlock output
        const b = c.createBuffer(1, 1, 22050), src = c.createBufferSource();
        src.buffer = b; src.connect(c.destination); src.start(0);
        this.unlocked = true;
      }
      const p = c.state === 'running' ? Promise.resolve() : c.resume();
      return p.then(() => { if (this.onReady) this.onReady(); }).catch(() => {});
    } catch { return Promise.resolve(); }
  },
  ready() { return !!this.ctx && this.ctx.state === 'running'; },
  tones(at) {
    const c = this.ctx, nodes = [];
    for (const dt of [0, 0.24]) {
      const t = at + dt, g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.5, t + 0.012);
      g.gain.setValueAtTime(0.5, t + 0.09);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
      g.connect(c.destination);
      for (const [f, v] of [[1568, 1], [3136, 0.35]]) {
        const o = c.createOscillator(), og = c.createGain();
        o.type = 'sine'; o.frequency.value = f; og.gain.value = v;
        o.connect(og).connect(g); o.start(t); o.stop(t + 0.2);
        nodes.push(o);
      }
    }
    return nodes;
  },
  /* queue the beep `sec` seconds from now; true when it is queued */
  schedule(sec) {
    this.cancel();
    if (!this.on || !this.ready()) return false;
    this.pending = this.tones(this.ctx.currentTime + Math.max(0, sec));
    return true;
  },
  cancel() {
    for (const o of this.pending) { try { o.stop(0); } catch {} try { o.disconnect(); } catch {} }
    this.pending = [];
  },
  beep() { if (this.ready()) this.tones(this.ctx.currentTime + 0.02); },
};
const Haptic = {
  tap() { try { navigator.vibrate && navigator.vibrate(10); } catch {} },
  done() { try { navigator.vibrate && navigator.vibrate([180, 90, 180]); } catch {} },
};

const Rest = {
  el: null, end: 0, total: 0, doneAt: 0,
  load() {
    try { const r = JSON.parse(lsGet(LS.rest) || 'null'); if (r && r.end > Date.now()) { this.end = r.end; this.total = r.total; } } catch {}
  },
  save() { lsSet(LS.rest, JSON.stringify(this.end ? { end: this.end, total: this.total } : null)); },
  armed: false,
  start(sec) { this.total = sec * 1000; this.end = Date.now() + this.total; this.doneAt = 0; this.save(); this.arm(); this.paint(true); },
  /* (re)queue the end-of-rest beep for the time that is left */
  arm() {
    const left = (this.end - Date.now()) / 1000;
    if (this.end && !this.doneAt && left > 0) this.armed = Sound.schedule(left);
    else { Sound.cancel(); this.armed = false; }
  },
  rearm() { if (this.end && !this.doneAt && !this.armed) this.arm(); },
  disarm() { Sound.cancel(); this.armed = false; },
  add(sec) {
    if (!this.end) return;
    if (this.doneAt) { if (sec > 0) this.start(sec); return; }
    this.end = Math.max(Date.now() + 1000, this.end + sec * 1000);
    this.total = Math.max(this.total + sec * 1000, this.end - Date.now(), 1000);
    this.save(); this.arm(); this.paint();
  },
  stop() { this.disarm(); this.end = 0; this.doneAt = 0; this.save(); this.paint(); },
  tick() {
    if (!this.end) return;
    if (this.end - Date.now() <= 0 && !this.doneAt) {
      this.doneAt = Date.now();
      // fallback when the beep could not be queued (only if we are on time)
      if (!this.armed && Sound.on && this.doneAt - this.end < 2000) Sound.beep();
      this.armed = false;
      Haptic.done();
    }
    if (this.doneAt && Date.now() - this.doneAt > 8000) { this.stop(); return; }
    this.paint();
  },
  paint(fresh) {
    const el = this.el;
    if (!this.end) { el.hidden = true; return; }
    el.hidden = false;
    const left = Math.max(0, this.end - Date.now());
    el.classList.toggle('is-done', !!this.doneAt);
    $('.rest-t', el).textContent = this.doneAt ? '0:00' : U.mmss(left);
    $('.rest-l', el).textContent = this.doneAt ? '休憩終了 · 次のセットへ' : `休憩 ${Math.round(this.total / 1000)}秒`;
    $('.prg', el).style.strokeDashoffset = String(100 - (left / this.total) * 100);
    if (fresh) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  },
};

const Wake = {
  lock: null,
  async sync() {
    const want = Store.settings.wake && !!Q.active() && document.visibilityState === 'visible';
    try {
      if (want && !this.lock && navigator.wakeLock) {
        this.lock = await navigator.wakeLock.request('screen');
        this.lock.addEventListener && this.lock.addEventListener('release', () => { this.lock = null; });
      } else if (!want && this.lock) { await this.lock.release(); this.lock = null; }
    } catch { this.lock = null; }
  },
};

/* ---------- charts (hand-drawn SVG, one series each) ---------- */
const f1 = n => Math.round(n * 10) / 10;
const ChartData = {
  weekly() {
    const ws = U.weekStart(Date.now()), days = new Set(Q.all().map(s => s.date)), items = [];
    for (let i = 11; i >= 0; i--) {
      const st = U.addDays(ws, -7 * i);
      let c = 0; for (let j = 0; j < 7; j++) if (days.has(U.key(U.addDays(st, j)))) c++;
      items.push({ v: c, l: U.mdS(st), tip: `${U.mdS(st)}の週 · ${c}回`, cur: i === 0 });
    }
    const mx = Math.max(...items.map(x => x.v)); const max = Math.max(4, mx + (mx % 2));
    return { items, max, ticks: [0, max / 2, max], fy: t => String(t), label: '週ごとのトレーニング回数' };
  },
  duration() {
    const ended = Q.all().filter(s => s.end), last = ended.slice(-12);
    const items = last.map((s, i) => ({ v: U.mins(s.end - s.start), l: U.mdS(s.start), tip: `${U.mdS(s.start)} · ${U.dur(s.end - s.start)}`, cur: i === last.length - 1 }));
    const avg = ended.length ? ended.reduce((a, s) => a + U.mins(s.end - s.start), 0) / ended.length : null;
    let max = Math.ceil(Math.max(60, ...items.map(x => x.v), avg || 0) / 60) * 60; if ((max / 60) % 2) max += 60;
    return { items, max, avg, ticks: [0, max / 2, max], fy: t => t ? `${t / 60}h` : '0', label: 'トレーニング時間' };
  },
  ex(name) {
    const r = Q.stats().ex.get(name); if (!r) return null;
    const full = r.history, zero = full.every(h => h.top === 0), val = h => zero ? h.reps : h.top;
    const prs = new Set(); let run = -Infinity;
    full.forEach((h, i) => { if (i > 0 && val(h) > run) prs.add(i); run = Math.max(run, val(h)); });
    const off = Math.max(0, full.length - 16), hist = full.slice(off);
    return {
      items: hist.map((h, i) => ({ v: val(h), l: U.mdS(h.t), pr: prs.has(i + off), tip: `${U.mdS(h.t)} · ${zero ? `自重 × ${h.reps}` : `${U.w(h.top)}kg × ${h.reps}`}` })),
      unit: zero ? '回' : 'kg', minSpan: zero ? 4 : 5,
      step: sp => zero ? (sp <= 8 ? 2 : 5) : sp <= 10 ? 2.5 : sp <= 25 ? 5 : sp <= 60 ? 10 : 20,
      label: `${name}の推移`,
    };
  },
};
const Charts = {
  mount(root) { root.querySelectorAll('.chart[data-chart]').forEach(el => this.draw(el)); },
  draw(el) {
    const W = Math.round(el.clientWidth) || 300, H = Math.round(el.clientHeight) || 172, kind = el.dataset.chart;
    const d = ChartData[kind] && ChartData[kind](el.dataset.arg);
    if (!d || !d.items.length) { el.innerHTML = '<p class="chart-empty">まだデータがありません</p>'; return; }
    el.innerHTML = (kind === 'ex' ? this.line(W, H, d) : this.bars(W, H, d)) + '<div class="tip"></div>';
  },
  bars(W, H, d) {
    const pl = 30, pr = 4, pt = 14, pb = 22, iw = W - pl - pr, ih = H - pt - pb, y0 = pt + ih;
    const n = d.items.length, band = iw / n, bw = Math.min(22, band * 0.62), Y = v => f1(y0 - (v / d.max) * ih);
    let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${U.esc(d.label)}">`;
    for (const t of d.ticks) s += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${pl - 7}" y="${Y(t) + 3.5}" text-anchor="end">${d.fy(t)}</text>`;
    const k = Math.ceil(n / 6);
    d.items.forEach((it, i) => {
      const x = f1(pl + band * i + (band - bw) / 2), top = Y(it.v), h = y0 - top;
      if (h > 0.5) { const r = Math.min(4, h, bw / 2); s += `<path class="bar mark${it.cur ? ' cur' : ''}" data-i="${i}" d="M${x},${y0}V${f1(top + r)}Q${x},${top} ${f1(x + r)},${top}H${f1(x + bw - r)}Q${f1(x + bw)},${top} ${f1(x + bw)},${f1(top + r)}V${y0}Z"/>`; }
      if ((n - 1 - i) % k === 0) s += `<text class="ax" x="${f1(x + bw / 2)}" y="${H - 5}" text-anchor="middle">${it.l}</text>`;
    });
    if (d.avg != null) { const ya = Y(d.avg); s += `<line class="avg" x1="${pl}" x2="${W - pr}" y1="${ya}" y2="${ya}"/>`; }
    d.items.forEach((it, i) => { s += `<rect class="hit" x="${f1(pl + band * i)}" y="${pt}" width="${f1(band)}" height="${ih}" data-i="${i}" data-tip="${U.esc(it.tip)}" data-x="${f1(pl + band * i + band / 2)}" data-y="${Math.min(Y(it.v), y0 - 2)}"/>`; });
    return s + '</svg>';
  },
  line(W, H, d) {
    const pl = 36, pr = 50, pt = 16, pb = 22, iw = W - pl - pr, ih = H - pt - pb, y0 = pt + ih;
    const vals = d.items.map(i => i.v);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const span = Math.max(hi - lo, d.minSpan), step = d.step(span);
    lo = Math.max(0, Math.floor((lo - span * 0.2) / step) * step);
    hi = Math.ceil((hi + span * 0.2) / step) * step; if (hi <= lo) hi = lo + step;
    const n = d.items.length;
    const X = i => f1(n === 1 ? pl + iw / 2 : pl + (iw * i) / (n - 1));
    const Y = v => f1(y0 - ((v - lo) / (hi - lo)) * ih);
    const P = d.items.map((it, i) => [X(i), Y(it.v)]);
    let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${U.esc(d.label)}">`;
    for (const t of [lo, (lo + hi) / 2, hi]) s += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${pl - 7}" y="${Y(t) + 3.5}" text-anchor="end">${U.w(t)}</text>`;
    if (n > 1) {
      s += `<path class="area" d="M${P[0][0]},${y0}L${P.map(p => p.join(',')).join('L')}L${P[n - 1][0]},${y0}Z"/>`;
      s += `<path class="ln" d="M${P.map(p => p.join(',')).join('L')}"/>`;
    }
    d.items.forEach((it, i) => { s += `<circle class="pt mark${it.pr ? ' pr' : ''}" data-i="${i}" cx="${P[i][0]}" cy="${P[i][1]}" r="4"/>`; });
    const L = P[n - 1];
    s += `<text class="lbl" x="${f1(L[0] + 10)}" y="${f1(L[1] + 4)}">${U.w(d.items[n - 1].v)}${d.unit}</text>`;
    const lab = n === 1 ? [0] : n < 5 ? [0, n - 1] : [0, Math.floor((n - 1) / 2), n - 1];
    lab.forEach(i => { s += `<text class="ax" x="${P[i][0]}" y="${H - 5}" text-anchor="middle">${d.items[i].l}</text>`; });
    const half = n === 1 ? iw / 2 : iw / (n - 1) / 2;
    d.items.forEach((it, i) => { s += `<rect class="hit" x="${f1(P[i][0] - half)}" y="${pt}" width="${f1(half * 2)}" height="${ih}" data-i="${i}" data-tip="${U.esc(it.tip)}" data-x="${P[i][0]}" data-y="${P[i][1] - 4}"/>`; });
    return s + '</svg>';
  },
  tip(h) {
    const chart = h.closest('.chart'); if (!chart) return;
    const tip = chart.querySelector('.tip'), W = chart.clientWidth;
    tip.textContent = h.dataset.tip;
    tip.style.left = Math.min(W - 64, Math.max(64, Number(h.dataset.x))) + 'px';
    tip.style.top = h.dataset.y + 'px';
    tip.classList.add('show');
    chart.querySelectorAll('.is-hot').forEach(x => x.classList.remove('is-hot'));
    const mk = chart.querySelector(`.mark[data-i="${h.dataset.i}"]`); if (mk) mk.classList.add('is-hot');
  },
  hideAll() {
    document.querySelectorAll('.chart .tip.show').forEach(t => t.classList.remove('show'));
    document.querySelectorAll('.chart .is-hot').forEach(x => x.classList.remove('is-hot'));
  },
};

    const cur = UI.tab === 'edit' ? UI.back : UI.tab;

    $('#liveDot').hidden = !Q.active() || UI.tab === 'today';
