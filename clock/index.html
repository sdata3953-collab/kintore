<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yakō Clock</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yakō">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500&display=swap">
<style>
/* Layout: one rounded black screen; the Earth as seen from 140.7°E with today's real day/night line, big thin time on the left, weather top right, a short line bottom left. */
:root{
  color-scheme: dark;
  --page:#000000;
  --screen:#010203;
  --fg:#F4F3F0;
  --fg-2:#C9C8C4;
  --fg-3:#8F8E8A;
  --hair:#5E5D5A;
  --f-ui:"Hanken Grotesk","Helvetica Neue","Hiragino Sans","Noto Sans JP",sans-serif;
  --r:clamp(26px,6vmin,56px);
}
html{height:100%;box-sizing:border-box;background:var(--page)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--page);color:var(--fg);font-family:var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
p{margin:0}
button{font:inherit}
:focus-visible{outline:1.5px solid var(--fg);outline-offset:3px}

.frame{height:100%;padding:max(clamp(14px,2.6vmin,24px),env(safe-area-inset-top)) max(clamp(14px,2.6vmin,24px),env(safe-area-inset-right)) max(clamp(14px,2.6vmin,24px),env(safe-area-inset-bottom)) max(clamp(14px,2.6vmin,24px),env(safe-area-inset-left))}
.screen{position:relative;height:100%;overflow:hidden;container-type:size;border-radius:var(--r);background:var(--screen);
  box-shadow:0 0 0 1px rgba(255,255,255,.07),inset 0 0 0 1px rgba(255,255,255,.03);user-select:none;-webkit-user-select:none}
.sky,.globe{position:absolute;display:block;pointer-events:none}
.sky{inset:0;width:100%;height:100%}
.globe{opacity:0;transition:opacity 1.6s ease}
.globe.is-ready{opacity:1}

.ui{position:absolute;inset:0;display:grid;gap:12px 24px;
  grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"time info" "time ." "greet cap";
  padding:clamp(22px,8cqh,60px) clamp(24px,6cqw,68px);transition:translate 4s ease}
.time{grid-area:time;align-self:center;font-size:min(36cqh,15.5cqw);font-weight:200;line-height:.92;letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;margin-left:-.05em;translate:0 -8%;text-shadow:0 2px 24px rgba(0,0,0,.6)}

.info{grid-area:info;display:flex;flex-direction:column;align-items:flex-start;gap:.5em;text-shadow:0 1px 12px rgba(0,0,0,.7)}
.date{font-size:clamp(12px,4cqh,20px);color:var(--fg-2);margin-bottom:.5em}
.wx{display:flex;flex-direction:column;align-items:flex-start;gap:.3em}
.wx-now{display:flex;align-items:center;gap:.28em;font-size:clamp(24px,10cqh,54px);font-weight:200;line-height:1}
.wx-icon{width:.78em;height:.78em;flex:none;color:var(--fg)}
.wx-icon svg{width:100%;height:100%;display:block;overflow:visible}
.wx-temp{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wx-place{font-size:clamp(11px,3.3cqh,15px);color:var(--fg-3);padding-left:.1em}
.wx-note{font-size:clamp(10px,2.8cqh,13px);color:var(--fg-3);padding-left:.1em}
.wx-status{font-size:clamp(11px,3cqh,14px);line-height:1.5;color:var(--fg-2);max-width:14em;padding-left:.1em}
.wx-btn{margin-top:.4em;border:1px solid var(--hair);background:rgba(255,255,255,.06);color:var(--fg);border-radius:999px;padding:.45em 1em;font-size:clamp(11px,3cqh,13px);cursor:pointer}
.wx.is-empty .wx-temp{color:var(--fg-3)}
.wx.is-stale .wx-now{opacity:.55}
.spin{transform-origin:12px 12px;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.greet{grid-area:greet;align-self:end;display:flex;flex-direction:column;align-items:flex-start;gap:.9em;font-size:clamp(11px,3.4cqh,16px);color:var(--fg-2);text-shadow:0 1px 12px rgba(0,0,0,.7)}
.greet p{white-space:pre-line;line-height:1.45}
.dash{width:1.6em;height:1px;background:var(--hair)}
.cap{grid-area:cap;align-self:end;font-size:clamp(9px,2.6cqh,11px);letter-spacing:.16em;text-transform:uppercase;color:var(--fg-3);opacity:.8;white-space:nowrap}

@media (orientation:portrait){
  .ui{grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"time time" "info info" ". ." "greet cap"}
  .time{align-self:start;font-size:min(28cqw,16cqh);translate:none;padding-top:4cqh}
  .info{flex-direction:row;flex-wrap:wrap;align-items:center;gap:.4em 1.4em}
  .date{margin:0}
  .wx{flex-direction:row;flex-wrap:wrap;align-items:center;gap:.4em .8em}
  .wx-now{font-size:clamp(22px,4.4cqh,40px)}
}
@media (prefers-reduced-motion:reduce){
  .spin{animation:none}
  .ui,.globe{transition:none}
}
</style>
</head>
<body>

<main class="frame">
  <div class="screen" id="screen" aria-label="置き時計">
    <canvas class="sky" id="sky" aria-hidden="true"></canvas>
    <canvas class="globe" id="globe" aria-hidden="true"></canvas>
    <div class="ui" id="ui">
      <p class="time"><span data-k="hh">00</span>:<span data-k="mm">00</span></p>
      <div class="info">
        <p class="date" data-k="date">&nbsp;</p>
        <div class="wx is-empty" id="wx">
          <div class="wx-now"><span class="wx-icon" id="wxIcon" aria-hidden="true"></span><span class="wx-temp"><span id="temp">--</span>°</span></div>
          <p class="wx-place" id="place">Noda</p>
          <p class="wx-note" id="wxNote" hidden></p>
          <p class="wx-status" id="wxStatus" aria-live="polite" hidden></p>
        </div>
      </div>
      <div class="greet"><span class="dash" aria-hidden="true"></span><p data-k="greet">&nbsp;</p><span class="dash" aria-hidden="true"></span></div>
      <p class="cap" title="ひまわりと同じ東経140.7°から見た地球。昼と夜の境目はいまの太陽の位置。地表と夜景はNASAの画像">Live sunlight · 140.7°E</p>
    </div>
  </div>
</main>

<script>
(() => {
  const HOME = [35.95, 139.87]; // Noda
  const VIEW_LON = 140.7, VIEW_LAT = 0; // Himawari's geostationary longitude

  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, '0');
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const rad = Math.PI / 180;
  const cache = new Map();
  function put(k, v){
    if (cache.get(k) === v) return;
    cache.set(k, v);
    document.querySelectorAll(`[data-k="${k}"]`).forEach((n) => { n.textContent = v; });
  }

  // ---------- Earth ----------
  // NASA imagery, equirectangular: Blue Marble (day), Earth at Night (city lights), and a water mask for the sun's glint on the sea.
  const TEX = { day: 'tex/day.jpg', night: 'tex/night.jpg', water: 'tex/water.png' };
  const toVec = (lat, lon) => [Math.cos(lat * rad) * Math.cos(lon * rad), Math.cos(lat * rad) * Math.sin(lon * rad), Math.sin(lat * rad)];
  const rng = (seed) => { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; };

  // View frame for an orthographic view centred on (VIEW_LAT, VIEW_LON), north up
  const EZ = toVec(VIEW_LAT, VIEW_LON);
  const EX = [-Math.sin(VIEW_LON * rad), Math.cos(VIEW_LON * rad), 0];
  const EY = [-Math.sin(VIEW_LAT * rad) * Math.cos(VIEW_LON * rad), -Math.sin(VIEW_LAT * rad) * Math.sin(VIEW_LON * rad), Math.cos(VIEW_LAT * rad)];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];

  // Subsolar point (NOAA approximation) → unit vector toward the Sun in Earth coordinates
  function sunVector(d){
    const doy = (d.getTime() - Date.UTC(d.getUTCFullYear(), 0, 0)) / 864e5;
    const g = 2 * Math.PI / 365 * (doy - 1);
    const eq = 229.18 * (.000075 + .001868 * Math.cos(g) - .032077 * Math.sin(g) - .014615 * Math.cos(2 * g) - .040849 * Math.sin(2 * g));
    const dec = .006918 - .399912 * Math.cos(g) + .070257 * Math.sin(g) - .006758 * Math.cos(2 * g) + .000907 * Math.sin(2 * g) - .002697 * Math.cos(3 * g) + .00148 * Math.sin(3 * g);
    const utcMin = d.getUTCHours() * 60 + d.getUTCMinutes() + d.getUTCSeconds() / 60;
    const lon = (720 - utcMin - eq) / 4;
    return [Math.cos(dec) * Math.cos(lon * rad), Math.cos(dec) * Math.sin(lon * rad), Math.sin(dec)];
  }

  const screen = $('screen'), skyCv = $('sky'), globeCv = $('globe');
  const T = {};
  function loadTex(key){
    return new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => {
        const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight;
        const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(im, 0, 0);
        T[key] = { w: c.width, h: c.height, d: x.getImageData(0, 0, c.width, c.height).data };
        res();
      };
      im.onerror = rej;
      im.src = TEX[key];
    });
  }
  // Bilinear sample of an equirectangular texture; writes rgb into out[0..2]
  const px3 = [0, 0, 0];
  function sample(t, lat, lon){
    const u = (lon + 180) / 360 * t.w - .5, v = Math.max(0, Math.min(t.h - 1.001, (90 - lat) / 180 * t.h - .5));
    const x0 = Math.floor(u), y0 = Math.floor(v), fx = u - x0, fy = v - y0;
    const xa = ((x0 % t.w) + t.w) % t.w, xb = (xa + 1) % t.w, y1 = Math.min(t.h - 1, y0 + 1);
    const a = (y0 * t.w + xa) * 4, b = (y0 * t.w + xb) * 4, c = (y1 * t.w + xa) * 4, d = (y1 * t.w + xb) * 4, D = t.d;
    for (let i = 0; i < 3; i++) px3[i] = (D[a + i] * (1 - fx) + D[b + i] * fx) * (1 - fy) + (D[c + i] * (1 - fx) + D[d + i] * fx) * fy;
    return px3;
  }

  function layout(){
    const W = screen.clientWidth, H = screen.clientHeight;
    if (!W || !H) return null;
    const land = W >= H;
    const R = land ? Math.min(.5 * H, .26 * W) : Math.min(.44 * W, .3 * H);
    const cx = land ? .63 * W : .5 * W, cy = land ? .6 * H : .64 * H;
    return { W, H, R, cx, cy };
  }

  function drawSky(L){
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    skyCv.width = Math.round(L.W * dpr); skyCv.height = Math.round(L.H * dpr);
    const x = skyCv.getContext('2d'), r = rng(7);
    x.scale(dpr, dpr);
    x.fillStyle = '#010203'; x.fillRect(0, 0, L.W, L.H);
    const n = Math.round(L.W * L.H / 2600);
    x.fillStyle = '#FFFFFF';
    for (let i = 0; i < n; i++){
      const big = r() < .08;
      x.globalAlpha = (big ? .55 : .25) * (.4 + r() * .6);
      x.beginPath(); x.arc(r() * L.W, r() * L.H, big ? .9 : .5, 0, Math.PI * 2); x.fill();
    }
    x.globalAlpha = 1;
  }

  let G = null;
  function build(){
    const L = layout();
    if (!L || !T.day || !T.night || !T.water) return;
    drawSky(L);
    const dpr = Math.min(2, window.devicePixelRatio || 1, 640 / L.R); // keep the per-pixel work bounded on big screens
    const padC = L.R * .14, sizeC = (L.R + padC) * 2;
    globeCv.style.width = sizeC + 'px'; globeCv.style.height = sizeC + 'px';
    globeCv.style.left = (L.cx - L.R - padC) + 'px'; globeCv.style.top = (L.cy - L.R - padC) + 'px';
    const N = Math.round(sizeC * dpr), Rd = L.R * dpr, c0 = N / 2;
    globeCv.width = globeCv.height = N;
    const M = Math.ceil(Math.PI * (Rd + 3) * (Rd + 3)) + 8 * N;
    const idx = new Int32Array(M), nx = new Float32Array(M), ny = new Float32Array(M), nz = new Float32Array(M), vz = new Float32Array(M);
    const edge = new Uint8Array(M), lights = new Uint8Array(M), water = new Uint8Array(M), day = new Uint8Array(M * 3);
    let k = 0;
    const lim = Math.ceil(Rd + 1.5);
    for (let py = Math.max(0, Math.floor(c0 - lim)); py < Math.min(N, Math.ceil(c0 + lim)); py++){
      const y = (c0 - py - .5) / Rd;
      for (let px = Math.max(0, Math.floor(c0 - lim)); px < Math.min(N, Math.ceil(c0 + lim)); px++){
        const x = (px + .5 - c0) / Rd, rr = Math.sqrt(x * x + y * y);
        if ((rr - 1) * Rd > 1 || k >= M) continue;
        const cl = Math.min(1, rr), z = Math.sqrt(Math.max(0, 1 - cl * cl));
        const sx = x / Math.max(1, rr), sy = y / Math.max(1, rr);
        const wx = sx * EX[0] + sy * EY[0] + z * EZ[0], wy = sx * EX[1] + sy * EY[1] + z * EZ[1], wz = sx * EX[2] + sy * EY[2] + z * EZ[2];
        const lat = Math.asin(Math.max(-1, Math.min(1, wz))) / rad, lon = Math.atan2(wy, wx) / rad;
        const dc = sample(T.day, lat, lon); day[k * 3] = dc[0]; day[k * 3 + 1] = dc[1]; day[k * 3 + 2] = dc[2];
        const nc = sample(T.night, lat, lon); const lum = .3 * nc[0] + .59 * nc[1] + .11 * nc[2];
        lights[k] = Math.max(0, Math.min(255, (lum - 26) * 1.4));
        water[k] = sample(T.water, lat, lon)[0];
        idx[k] = py * N + px; nx[k] = wx; ny[k] = wy; nz[k] = wz; vz[k] = z;
        edge[k] = 255 * Math.max(0, Math.min(1, (1 - rr) * Rd + .5));
        k++;
      }
    }
    G = { N, Rd, c0, dpr, count: k, idx, nx, ny, nz, vz, edge, lights, water, day, img: null };
    paint();
  }

  function paint(){
    if (!G) return;
    const ctx = globeCv.getContext('2d');
    const S = sunVector(new Date());
    let hx = S[0] + EZ[0], hy = S[1] + EZ[1], hz = S[2] + EZ[2]; const hl = Math.hypot(hx, hy, hz); hx /= hl; hy /= hl; hz /= hl;
    if (!G.img) G.img = ctx.createImageData(G.N, G.N);
    const D = G.img.data; D.fill(0);
    for (let i = 0; i < G.count; i++){
      const x = G.nx[i], y = G.ny[i], z = G.nz[i], v = G.vz[i];
      const l = x * S[0] + y * S[1] + z * S[2];
      const t = Math.max(0, Math.min(1, (l + .06) / .2)), d = t * t * (3 - 2 * t);
      const lit = .015 + Math.pow(Math.max(0, l), .62) * d;
      const k = i * 3;
      let r = G.day[k] * lit, g = G.day[k + 1] * lit, b = G.day[k + 2] * lit;
      const tw = Math.exp(-(((l - .02) / .08) ** 2));          // warmer light along the terminator
      r *= 1 + .3 * tw; g *= 1 + .05 * tw; b *= 1 - .2 * tw;
      const rim = Math.pow(1 - v, 3), air = rim * (.1 + .9 * d); // atmosphere at the limb
      r += 70 * air; g += 125 * air; b += 245 * air;
      const hz2 = (1 - v) * d; r += 8 * hz2; g += 16 * hz2; b += 30 * hz2;
      const gl = Math.pow(Math.max(0, x * hx + y * hy + z * hz), 150) * G.water[i] / 255 * d; // sun glint
      r += 200 * gl; g += 195 * gl; b += 180 * gl;
      const nite = Math.pow(1 - d, 1.6), L = G.lights[i] / 255 * nite * (.45 + .55 * v); // city lights
      r += 265 * L; g += 200 * L; b += 130 * L;
      r += 1.5 * nite; g += 4 * nite; b += 9 * nite;
      const p = G.idx[i] * 4;
      D[p] = r; D[p + 1] = g; D[p + 2] = b; D[p + 3] = G.edge[i];
    }
    ctx.putImageData(G.img, 0, 0);

    // thin halo behind the disc
    ctx.save();
    ctx.globalCompositeOperation = 'destination-over';
    const halo = ctx.createRadialGradient(G.c0, G.c0, G.Rd * .97, G.c0, G.c0, G.Rd * 1.12);
    halo.addColorStop(0, 'rgba(110,155,255,.3)'); halo.addColorStop(.35, 'rgba(90,135,240,.09)'); halo.addColorStop(1, 'rgba(80,120,230,0)');
    ctx.fillStyle = halo; ctx.fillRect(0, 0, G.N, G.N);
    ctx.restore();

    // home marker
    const hv = toVec(HOME[0], HOME[1]);
    if (dot(hv, EZ) > 0){
      const px = G.c0 + dot(hv, EX) * G.Rd, py = G.c0 - dot(hv, EY) * G.Rd;
      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = G.dpr;
      ctx.beginPath(); ctx.arc(px, py, 4.5 * G.dpr, 0, Math.PI * 2); ctx.stroke();
    }
    globeCv.classList.add('is-ready');
  }

  Promise.all([loadTex('day'), loadTex('night'), loadTex('water')]).then(build).catch(() => {});
  let rt;
  new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(build, 180); }).observe(screen);

  // ---------- Weather icons (line style) ----------
  const CLOUD = 'M6.5 18H17a3.5 3.5 0 0 0 0-7a5 5 0 0 0-9.4 1.1A3 3 0 0 0 6.5 18Z';
  const rays = (cx, cy, r1, r2, from = 0, to = 8) => Array.from({ length: to - from }, (_, j) => {
    const a = (j + from) * Math.PI / 4;
    return `<line x1="${(cx + Math.cos(a) * r1).toFixed(2)}" y1="${(cy + Math.sin(a) * r1).toFixed(2)}" x2="${(cx + Math.cos(a) * r2).toFixed(2)}" y2="${(cy + Math.sin(a) * r2).toFixed(2)}"/>`;
  }).join('');
  const ICONS = {
    'clear-d': `<circle cx="12" cy="12" r="4"/>${rays(12, 12, 6.5, 8.6)}`,
    'clear-n': `<path d="M19.5 14.2A7.5 7.5 0 1 1 9.8 4.5a6 6 0 0 0 9.7 9.7Z"/>`,
    'partly-d': `<circle cx="7.6" cy="7.6" r="2.6"/>${rays(7.6, 7.6, 4.2, 5.6, 3, 8)}<path transform="translate(1.6 1.2)" d="${CLOUD}"/>`,
    'partly-n': `<path d="M10.6 8.6A4 4 0 1 1 5.4 3.4a3.2 3.2 0 0 0 5.2 5.2Z"/><path transform="translate(1.6 1.2)" d="${CLOUD}"/>`,
    'cloudy': `<path d="${CLOUD}"/>`,
    'rain': `<path transform="translate(0 -2.5)" d="${CLOUD}"/><line x1="9" y1="18.5" x2="8" y2="21"/><line x1="12.5" y1="18.5" x2="11.5" y2="21"/><line x1="16" y1="18.5" x2="15" y2="21"/>`,
    'storm': `<path transform="translate(0 -2.5)" d="${CLOUD}"/><path d="M12.8 16.8l-2.3 3.2h3l-2.2 3.2"/>`,
    'snow': `<path transform="translate(0 -2.5)" d="${CLOUD}"/><circle cx="9" cy="19.5" r=".55" fill="currentColor"/><circle cx="12.5" cy="21" r=".55" fill="currentColor"/><circle cx="16" cy="19.5" r=".55" fill="currentColor"/>`,
    'loading': `<circle class="spin" cx="12" cy="12" r="7" stroke-dasharray="1 3.2" opacity=".6"/>`,
    'none': `<circle cx="12" cy="12" r="7" stroke-dasharray="1 3.2" opacity=".35"/>`
  };
  const iconSvg = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">${ICONS[k] || ICONS.cloudy}</svg>`;
  // WMO weather codes (Open-Meteo) → icon family
  function condOf(n){
    if (n <= 1) return 'clear';
    if (n === 2) return 'partly';
    if ((n >= 51 && n <= 67) || (n >= 80 && n <= 82)) return 'rain';
    if ((n >= 71 && n <= 77) || n === 85 || n === 86) return 'snow';
    if (n >= 95) return 'storm';
    return 'cloudy';
  }

  // ---------- Weather (Open-Meteo, free, no key) ----------
  const WX_URL = `https://api.open-meteo.com/v1/forecast?latitude=${HOME[0]}&longitude=${HOME[1]}&current=temperature_2m,weather_code,is_day&current_weather=true&timezone=Asia%2FTokyo`;
  const wx = $('wx'), iconEl = $('wxIcon'), tempEl = $('temp'), noteEl = $('wxNote'), statusEl = $('wxStatus');
  const W = { cur: null, at: 0, failed: false, loading: true };
  const KEY = 'yako.wx.v2';
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (s && s.cur && typeof s.at === 'number' && Date.now() - s.at < 6 * 36e5){ W.cur = s.cur; W.at = s.at; }
  } catch (e) {}
  let iconKey = '';
  const setIcon = (k) => { if (k !== iconKey){ iconKey = k; iconEl.innerHTML = iconSvg(k); } };

  function renderWx(){
    const c = W.cur;
    wx.classList.toggle('is-empty', !c);
    if (c){
      const f = condOf(c.code);
      setIcon(f === 'clear' || f === 'partly' ? `${f}-${c.day ? 'd' : 'n'}` : f);
      tempEl.textContent = c.temp;
      const stale = Date.now() - W.at > 75 * 6e4;
      const t = new Date(W.at);
      noteEl.hidden = !stale;
      if (stale) noteEl.textContent = `Updated ${t.getHours()}:${pad(t.getMinutes())}`;
      wx.classList.toggle('is-stale', stale);
      statusEl.hidden = true;
    } else {
      setIcon(W.loading ? 'loading' : 'none');
      tempEl.textContent = '--';
      noteEl.hidden = true;
      wx.classList.remove('is-stale');
      statusEl.hidden = !W.failed;
      statusEl.textContent = '天気を取得できませんでした。少しあとでまた試します';
    }
  }

  let inflight = false;
  async function fetchWx(){
    if (inflight) return;
    inflight = true;
    try {
      const ctrl = new AbortController();
      const to = setTimeout(() => ctrl.abort(), 12000);
      const res = await fetch(WX_URL, { cache: 'no-store', signal: ctrl.signal });
      clearTimeout(to);
      if (!res.ok) throw new Error(String(res.status));
      const j = await res.json();
      const c = j.current || {}, cw = j.current_weather || {};
      const temp = typeof c.temperature_2m === 'number' ? c.temperature_2m : cw.temperature;
      const code = typeof c.weather_code === 'number' ? c.weather_code : cw.weathercode;
      const isDay = typeof c.is_day === 'number' ? c.is_day : cw.is_day;
      if (typeof temp !== 'number') throw new Error('unexpected response');
      W.cur = { temp: String(Math.round(temp)), code: Number(code) || 0, day: isDay !== 0 };
      W.at = Date.now(); W.failed = false;
      try { localStorage.setItem(KEY, JSON.stringify({ cur: W.cur, at: W.at })); } catch (e) {}
    } catch (e) {
      W.failed = true;
    }
    W.loading = false; inflight = false;
    renderWx();
  }
  setInterval(fetchWx, 15 * 6e4);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - W.at > 10 * 6e4) fetchWx(); });
  window.addEventListener('online', fetchWx);

  // ---------- Clock ----------
  const greeting = (h) => h >= 5 && h < 10 ? 'Good Morning' : h >= 10 && h < 17 ? 'Make it happen.' : h >= 17 && h < 21 ? 'Better things ahead.' : h >= 21 ? 'Good Night.\nSee you tomorrow.' : 'Sleep well.';
  let minuteKey = '';
  function tick(){
    const now = new Date(), h = now.getHours();
    put('hh', pad(h));
    put('mm', pad(now.getMinutes()));
    const mk = `${now.toDateString()} ${h}:${now.getMinutes()}`;
    if (mk !== minuteKey){
      minuteKey = mk;
      put('date', `${DOW[now.getDay()]}, ${MON[now.getMonth()]} ${now.getDate()}`);
      put('greet', greeting(h));
      renderWx();
      paint(); // the day/night line moves about a quarter degree a minute
    }
    setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
  }

  // Keep the screen on while it sits on the nightstand
  let lock = null;
  async function keepAwake(){
    try {
      if ('wakeLock' in navigator && !lock && document.visibilityState === 'visible'){
        lock = await navigator.wakeLock.request('screen');
        lock.addEventListener('release', () => { lock = null; });
      }
    } catch (err) { lock = null; }
  }
  document.addEventListener('pointerdown', keepAwake);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
  keepAwake();

  // Burn-in guard: shift the text a few pixels each minute
  const ui = $('ui');
  setInterval(() => {
    const r = () => Math.round(Math.random() * 6 - 3);
    ui.style.translate = `${r()}px ${r()}px`;
  }, 60000);

  tick();

  fetchWx();
  if ('serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
})();
</script>
</body>
</html>
